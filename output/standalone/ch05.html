// クリックでチェックできるリスト。状態は localStorage に残すので、
// ページを閉じて開き直しても消えない（章ごと・項目ごとに保存）。
function CheckList({ items }) {
  const storeKey = 'cot-check-ch05';
  const [checked, setChecked] = useState(() => {
    try {
      return JSON.parse(localStorage.getItem(storeKey) || '{}');
    } catch (e) {
      return {};
    }
  });
  const toggle = (text) => {
    const next = { ...checked, [text]: !checked[text] };
    setChecked(next);
    try {
      localStorage.setItem(storeKey, JSON.stringify(next));
    } catch (e) {
      /* 保存できなくても表示は動かす */
    }
  };
  return (
    <div className="chk-list">
      {items.map((text, i) => (
        <label key={i} className={"chk-item" + (checked[text] ? ' done' : '')}>
          <input type="checkbox" checked={!!checked[text]} onChange={() => toggle(text)} />
          <span>{text}</span>
        </label>
      ))}
    </div>
  );
}

  if (!keywords || keywords.length === 0) return null;
  return (
    <aside className="w-64 shrink-0 no-print hidden lg:block">

  );
}

function Quiz({ items }) {
  const [answers, setAnswers] = useState({});
  if (!items || items.length === 0) return null;
  return (
    <div className="mt-10 pt-6 border-t-2 border-gray-200">
      <h3 className="text-lg font-bold text-purple-800 mb-4">📝 確認クイズ</h3>
      {items.map((item, qi) => {
        const selected = answers[qi];
        return (
          <div key={qi} className="mb-6">
            <p className="font-semibold text-gray-800 mb-2">Q{qi + 1}. {item.q}</p>
            {item.options.map((opt, oi) => {
              let cls = 'quiz-option';
              if (selected !== undefined) {
                if (oi === item.answer) cls += ' correct';
                else if (oi === selected) cls += ' wrong';
              }
              return (
                <div key={oi} className={cls} onClick={() => setAnswers({ ...answers, [qi]: oi })}>{opt}</div>
              );
            })}
            {selected !== undefined && (
              <p className={"text-sm mt-2 p-3 rounded-lg " + (selected === item.answer ? 'bg-green-50 text-green-800' : 'bg-red-50 text-red-800')}>
                {selected === item.answer ? '⭕ 正解！' : '❌ 不正解。'} {item.explain}
              </p>
            )}
          </div>
        );
      })}
    </div>
  );
}

                  <h3>対応表で覚える</h3>

                    <strong>📌 range(8) が 0〜7 なのはJSと同じ考え方:</strong> 第3章で「0から数える」を学びました。Pythonも同じです。<strong><code>range(8)</code> は「8個ぶん、0から数える」</strong> という意味なので、8は含まれません。8×8の盤面を全部まわすなら <code>for row in range(8): for col in range(8):</code> の二重ループになります。
                  </div>
                  <h3>リストと辞書</h3>
                  <p>JSの配列がPythonでは<strong>リスト</strong>、JSのオブジェクトが<strong>辞書</strong>にあたります。オセロの盤面や戦績を扱うときに使います。</p>
                  <div className="code-block">{`# リスト（JSの配列）
scores = [10, 25, 8]
scores.append(30)        # 追加（JSのpush）
print(len(scores))       # 個数（JSのlength）
print(scores[0])         # 10（0から数える）
print(scores[-1])        # 30（末尾。Python独自で便利）

# 辞書（JSのオブジェクト）
player = {"name": "田中", "wins": 3}
print(player["name"])    # 田中
player["wins"] = 4       # 更新

# 辞書のリスト（戦績データはこんな形になる）
records = [
    {"winner": "黒", "black": 38, "white": 26},
    {"winner": "白", "black": 20, "white": 44},
]
for r in records:
    print(r["winner"], r["black"], "-", r["white"])`}</div>
                  <h3>2次元リスト — オセロの盤面</h3>
                  <p>第3章でJavaScriptの2次元配列を扱いました。Pythonでもまったく同じ考え方で書けます。<strong><code>board[行][列]</code></strong> です。</p>
                  <div className="code-block">{`# 8×8を空（0）で初期化する
board = [[0] * 8 for _ in range(8)]

# 中央4マスに初期配置（1=黒, 2=白）
board[3][3] = 2
board[3][4] = 1
board[4][3] = 1
board[4][4] = 2

# 盤面を文字で表示する
MARK = {0: ".", 1: "●", 2: "○"}
for row in board:
    print(" ".join(MARK[cell] for cell in row))`}</div>
                  <div className="warn-box">
                    <strong>⚠️ 盤面の作り方でよくある罠:</strong> <code>board = [[0] * 8] * 8</code> と書きたくなりますが、<strong>これは動きません</strong>。<br />同じ行が8個並んでいるだけなので、1マス変えると8行すべてが変わります。
                    <p className="mt-2">正しくは <code>[[0] * 8 for _ in range(8)]</code> のように、行を8回作ります。<br />これはPython特有の落とし穴で、多くの人が一度は踏みます。</p>
                  </div>
                  <h3>関数と import</h3>
                  <div className="code-block">{`def count_stones(board, color):
    """盤面の中の指定色の石を数える"""
    total = 0
    for row in board:
        for cell in row:
            if cell == color:
                total = total + 1
    return total

# 引数に既定値をつけられる
def greet(name, greeting="こんにちは"):
    return f"{greeting}、{name}さん"

print(greet("田中"))                  # こんにちは、田中さん
print(greet("田中", "おはよう"))       # おはよう、田中さん`}</div>
                  <p>他のファイルやライブラリの機能を使うときは <code>import</code> します。次章以降で毎回書くことになります。</p>

                  <h3>環境を用意する</h3>
                  <p>Pythonをインストールしたら、プロジェクトごとに<strong>仮想環境</strong>を作ります。これは「このプロジェクト専用のライブラリ置き場」で、別のプロジェクトと混ざらないようにする仕組みです。</p>
                  <div className="code-block">{`python -m venv venv          # 仮想環境を作る（最初の1回だけ）

# 有効化する（作業のたびに実行）
venv\\Scripts\\activate        # Windows
source venv/bin/activate     # Mac / Linux

pip install fastapi          # ライブラリを入れる（次章で使う）
pip list                     # 入っているものを確認
pip freeze > requirements.txt  # 何を入れたかを記録（デプロイで使う）`}</div>

                        <tr><td className="tbl-td">NameError</td><td className="tbl-td">その名前が見つからない</td><td className="tbl-td">打ち間違い / JSの癖で <code>true</code> と書いた</td></tr>
                        <tr><td className="tbl-td">TypeError</td><td className="tbl-td">型が合わない</td><td className="tbl-td">数値と文字列を足そうとした</td></tr>

                        <tr><td className="tbl-td">SyntaxError</td><td className="tbl-td">文法が壊れている</td><td className="tbl-td">コロン忘れ / 括弧の閉じ忘れ</td></tr>
