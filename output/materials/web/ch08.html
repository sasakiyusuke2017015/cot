<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web開発の虎の巻 第8章 - DB連携</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { font-family: 'Yu Gothic UI', 'Yu Gothic', 'YuGothic', sans-serif; }
.prose h3 { font-size:1.1rem; font-weight:700; margin:2.5rem 0 0.75rem; color:#1e3a8a; padding-top:1.5rem; border-top:2px solid #e5e7eb; }
.prose h3:first-child { margin-top:0.5rem; border-top:none; padding-top:0; }
.prose p { margin-bottom:1.1rem; line-height:1.9; color:#374151; }
.prose ul { list-style:disc; padding-left:1.5rem; margin-bottom:1.1rem; }
.prose ul li { margin-bottom:0.5rem; color:#374151; }
.prose ol { list-style:decimal; padding-left:1.5rem; margin-bottom:1.1rem; }
.prose ol li { margin-bottom:0.5rem; color:#374151; }
.kv-box  { background:#eff6ff; border-left:4px solid #3b82f6; padding:1rem 1.25rem; border-radius:0 0.5rem 0.5rem 0; margin:1.75rem 0; line-height:1.8; }
.warn-box{ background:#fff7ed; border-left:4px solid #f97316; padding:1rem 1.25rem; border-radius:0 0.5rem 0.5rem 0; margin:1.75rem 0; line-height:1.8; }
.tip-box { background:#f0fdf4; border-left:4px solid #10b981; padding:1rem 1.25rem; border-radius:0 0.5rem 0.5rem 0; margin:1.75rem 0; line-height:1.8; }
.ex-box  { background:#faf5ff; border:2px dashed #7c3aed; padding:1.1rem 1.25rem; border-radius:0.75rem; margin:1.75rem 0; }
.ex-box .ex-title { font-weight:700; color:#5b21b6; margin-bottom:0.75rem; }
.chk-item { display:flex; gap:0.5rem; padding:0.4rem 0; font-size:0.875rem; color:#374151; align-items:flex-start; }
.chk-item::before { content:"☐"; color:#f97316; font-size:1rem; flex-shrink:0; margin-top:-1px; }
.quiz-option { cursor:pointer; padding:0.5rem 1rem; border:2px solid #e5e7eb; border-radius:0.5rem; margin:0.4rem 0; transition:all 0.2s; }
.quiz-option:hover { border-color:#3b82f6; background:#eff6ff; }
.quiz-option.correct { border-color:#10b981; background:#f0fdf4; color:#065f46; }
.quiz-option.wrong { border-color:#ef4444; background:#fef2f2; color:#991b1b; }
.tag { display:inline-block; padding:0.15rem 0.5rem; border-radius:9999px; font-size:0.7rem; font-weight:600; }
.tag-core { background:#dbeafe; color:#1d4ed8; }
.tag-user { background:#d1fae5; color:#065f46; }
.code-block { background:#111827; color:#f3f4f6; font-family:Consolas, Monaco, monospace; font-size:0.8rem; line-height:1.7; border-radius:0.5rem; padding:1rem 1.25rem; overflow-x:auto; margin:1.25rem 0; white-space:pre; }
.assign-box { background:linear-gradient(135deg,#fff7ed,#fef3c7); border:2px solid #f59e0b; border-radius:0.75rem; padding:1.25rem 1.5rem; margin:2rem 0; }
.assign-title { font-weight:700; font-size:1.05rem; color:#92400e; margin-bottom:0.5rem; }
.assign-goal { color:#78350f; margin-bottom:0.9rem; line-height:1.8; }
.assign-h { font-weight:700; font-size:0.85rem; color:#92400e; margin:0.9rem 0 0.4rem; }
.assign-steps { list-style:decimal; padding-left:1.5rem; margin-bottom:0.5rem; }
.assign-steps li { margin-bottom:0.35rem; color:#451a03; }
.assign-hint { margin-top:0.9rem; font-size:0.85rem; color:#78350f; background:#fffbeb; border-radius:0.5rem; padding:0.6rem 0.8rem; }
.tbl-wrap { overflow-x:auto; margin:1.5rem 0; border:1px solid #e5e7eb; border-radius:0.5rem; }
.tbl { width:100%; border-collapse:collapse; font-size:0.85rem; min-width:480px; }
.tbl-th { background:#1e3a8a; color:#fff; text-align:left; padding:0.6rem 0.8rem; font-weight:600; }
.tbl-td { border-top:1px solid #e5e7eb; padding:0.6rem 0.8rem; vertical-align:top; color:#374151; }
.tbl tbody tr:nth-child(even) { background:#f9fafb; }
@media print { .no-print { display:none; } }
</style>
</head>
<body class="bg-gray-50">
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const KEYWORDS = [
  {
    "term": "3層構成",
    "desc": "ブラウザ → API → DB。Webアプリの基本形"
  },
  {
    "term": "コネクション",
    "desc": "プログラムからDBへの接続"
  },
  {
    "term": "プレースホルダ",
    "desc": "SQLに値を安全に埋め込む仕組み。? や %s で書く"
  },
  {
    "term": "SQLインジェクション",
    "desc": "入力値でSQLを改ざんされる攻撃。文字列連結が原因"
  },
  {
    "term": "ORM",
    "desc": "SQLをコードとして書ける道具。型とDBがつながる"
  }
];

const QUIZ = [
  {
    "q": "Webアプリの3層構成におけるAPIの位置づけはどれか。",
    "options": [
      "DBの中に保存されるデータの一種",
      "画面のデザインを決める層",
      "ブラウザとDBの橋渡しをする",
      "インターネット回線そのもの"
    ],
    "answer": 2,
    "explain": "ブラウザ（画面）→API（橋渡し）→DB（保存先）という3層がWebアプリの基本形である。この絵が描ければ全体像を理解できたと言える。"
  },
  {
    "q": "SQLに値を埋め込むとき、プレースホルダ（? など）を使う理由はどれか。",
    "options": [
      "文字列連結よりも実行速度が速くなるため",
      "文字列連結だとSQLインジェクションで乗っ取られる危険があるため",
      "データベースの容量を節約するため",
      "SQLの文字数制限を回避するため"
    ],
    "answer": 1,
    "explain": "ユーザー入力を文字列連結でSQLに埋め込むと、入力次第で条件を無意味にされたりテーブルを削除されたりする。入力値は必ずプレースホルダで渡す。"
  }
];

function KeywordsPanel({ keywords }) {
  if (!keywords || keywords.length === 0) return null;
  return (
    <aside className="w-64 shrink-0 no-print hidden lg:block">
      <div className="sticky top-24 bg-white rounded-xl shadow-sm border border-gray-100 p-4">
        <p className="font-bold text-sm text-blue-900 mb-3">🔑 重要キーワード</p>
        {keywords.map((k, i) => (
          <div key={i} className="mb-3">
            <p className="text-sm font-semibold text-gray-800">{k.term}</p>
            <p className="text-xs text-gray-500 leading-relaxed">{k.desc}</p>
          </div>
        ))}
      </div>
    </aside>
  );
}

function Quiz({ items }) {
  const [answers, setAnswers] = useState({});
  if (!items || items.length === 0) return null;
  return (
    <div className="mt-10 pt-6 border-t-2 border-gray-200">
      <h3 className="text-lg font-bold text-purple-800 mb-4">📝 確認クイズ</h3>
      {items.map((item, qi) => {
        const selected = answers[qi];
        return (
          <div key={qi} className="mb-6">
            <p className="font-semibold text-gray-800 mb-2">Q{qi + 1}. {item.q}</p>
            {item.options.map((opt, oi) => {
              let cls = 'quiz-option';
              if (selected !== undefined) {
                if (oi === item.answer) cls += ' correct';
                else if (oi === selected) cls += ' wrong';
              }
              return (
                <div key={oi} className={cls} onClick={() => setAnswers({ ...answers, [qi]: oi })}>{opt}</div>
              );
            })}
            {selected !== undefined && (
              <p className={"text-sm mt-2 p-3 rounded-lg " + (selected === item.answer ? 'bg-green-50 text-green-800' : 'bg-red-50 text-red-800')}>
                {selected === item.answer ? '⭕ 正解！' : '❌ 不正解。'} {item.explain}
              </p>
            )}
          </div>
        );
      })}
    </div>
  );
}

function Page() {
  return (
    <div className="min-h-screen flex flex-col">
      <header className="bg-gradient-to-r from-blue-900 to-blue-700 text-white shadow-lg no-print sticky top-0 z-10">
        <div className="max-w-7xl mx-auto px-6 py-3 flex items-center gap-3">
          <a href="../../index.html" className="px-2 py-1 rounded hover:bg-white/20 text-sm">← 目次</a>
          <p className="font-bold flex-1">🐯 Web開発の虎の巻</p>
          <p className="text-sm text-blue-200">第8章 / 全11章</p>
        </div>
      </header>

      <div className="max-w-7xl mx-auto w-full flex-1">
        <main className="flex-1 p-6 min-w-0">
          <div className="rounded-2xl p-6 mb-6 text-white shadow-md bg-gradient-to-r from-emerald-700 to-emerald-500">
            <span className="tag bg-white/20 text-white">第8章 · バックエンド</span>
            <h1 className="text-2xl font-bold mt-2">🗄️ DB連携</h1>
            <p className="text-emerald-100 mt-1">サーバからデータを保存する</p>
          </div>

          <div className="flex gap-6 items-start">
            <div className="flex-1 min-w-0">
              <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 md:p-8">
                <div className="prose">
                  <div className="kv-box">
                    <strong>🎯 この章のゴール:</strong> 前章のAPIをDBに繋ぎ、<strong>サーバを再起動しても戦績が残る</strong>状態にする。Webアプリの3層構成を自分の言葉で説明できるようになる。
                  </div>
                  <h3>全体像がつながる</h3>
                  <p>ここまでに作ったものが、いよいよ1本につながります。</p>
                  <div className="code-block">{`[ブラウザ]          [サーバ]              [DB]
オセロの画面   →    FastAPI        →    games テーブル
HTML/CSS/JS   ←    Python         ←    players テーブル

  fetch()          エンドポイント        SQL`}</div>
                  <p>この3層の絵が描ければ、Webアプリの基本は理解できたと言えます。<strong>APIがブラウザとDBの橋渡しをしている</strong>——これがいちばん大事な理解です。</p>
                  <h3>PythonからDBに繋ぐ</h3>
                  <p>まずは生のSQLで動かします。SQLiteなら追加のインストールも要りません。</p>
                  <div className="code-block">{`# db.py
import sqlite3

def get_conn():
    conn = sqlite3.connect("othello.db")
    conn.row_factory = sqlite3.Row   # 辞書のように使えるようにする
    return conn

def init_db():
    conn = get_conn()
    conn.execute("""
        CREATE TABLE IF NOT EXISTS games (
          id          INTEGER PRIMARY KEY AUTOINCREMENT,
          winner      TEXT NOT NULL,
          black_count INTEGER NOT NULL,
          white_count INTEGER NOT NULL,
          played_at   TIMESTAMP DEFAULT CURRENT_TIMESTAMP
        )
    """)
    conn.commit()
    conn.close()`}</div>
                  <h3>APIをDBに繋ぎ替える</h3>
                  <p>前章では戦績をリスト（メモリ）に入れていました。そこをDBの読み書きに置き換えます。</p>
                  <div className="code-block">{`# main.py
@app.get("/api/games")
def list_games():
    conn = get_conn()
    rows = conn.execute(
        "SELECT * FROM games ORDER BY played_at DESC"
    ).fetchall()
    conn.close()
    return [dict(r) for r in rows]

@app.post("/api/games")
def add_game(game: Game):
    conn = get_conn()
    conn.execute(
        "INSERT INTO games (winner, black_count, white_count) VALUES (?, ?, ?)",
        (game.winner, game.black_count, game.white_count),   # ← 値は別で渡す
    )
    conn.commit()
    conn.close()
    return {"ok": True}`}</div>
                  <div className="kv-box">
                    <strong>📌 ここが本章のハイライト:</strong> この状態で<strong>サーバを再起動してから一覧を見てください</strong>。データが残っているはずです。前章までは消えていました。この違いが「保存する」ということです。
                  </div>
                  <h3>絶対にやってはいけない書き方</h3>
                  <p>上のコードで、値を `?` で書いて別に渡しているのには理由があります。もし文字列を繋げて書くと、<strong>入力次第でSQLを乗っ取られます</strong>。</p>
                  <div className="code-block">{`# ❌ 絶対にダメな書き方
name = 受け取った値
conn.execute("SELECT * FROM players WHERE name = '" + name + "'")

# もし name に  ' OR '1'='1  が入ったら、実行されるSQLは
# SELECT * FROM players WHERE name = '' OR '1'='1'
# → 全件が返ってくる（条件が無意味になる）

# もっと悪いと  '; DROP TABLE games; --  で表ごと消される`}</div>
                  <div className="code-block">{`# ⭕ 正しい書き方（プレースホルダを使う）
conn.execute("SELECT * FROM players WHERE name = ?", (name,))`}</div>
                  <div className="warn-box">
                    <strong>⚠️ SQLインジェクション:</strong> これは<strong>実際に起き続けている代表的な攻撃</strong>です。「自分のアプリは小さいから大丈夫」ということはありません。<strong>ユーザーからの入力をSQLに文字列連結しない</strong>——これだけは例外なく守ってください。
                  </div>
                  <h3>ORM — SQLをコードで書く</h3>
                  <p>生SQLで仕組みが分かったら、<strong>ORM</strong>という道具に進めます。SQLをPythonのコードとして書けるようになり、プレースホルダも自動で使われるので安全です。</p>
                  <div className="code-block">{`# SQLAlchemy を使った例
games = session.query(Game).order_by(Game.played_at.desc()).all()

session.add(Game(winner="黒", black_count=38, white_count=26))
session.commit()`}</div>
                  <div className="tip-box">
                    <strong>💡 なぜ生SQLを先にやったか:</strong> ORMは便利ですが、<strong>中で何が起きているか分からないまま使うと詰まったとき何もできません</strong>。生SQLを知っていれば「ORMがどんなSQLを出しているか」を確認して原因を追えます。順番が大事です。
                  </div>
                  <div className="assign-box">
                    <p className="assign-title">🛠 課題: 戦績が消えないようにする</p>
                    <p className="assign-goal">前章のAPIをDBに繋ぎます。<strong>サーバを再起動してもデータが残る</strong>ことを確認するのが、この章のいちばんの成果です。</p>
                    <p className="assign-h">作るもの</p>
                    <ol className="assign-steps">
                      <li>第6章で設計したテーブルを、実際にDBに作る</li>
                      <li>GET /api/games を DBのSELECTに置き換える</li>
                      <li>POST /api/games を DBのINSERTに置き換える</li>
                      <li>オセロで何回か対戦し、戦績を貯める</li>
                      <li><strong>サーバを再起動して、データが残っていることを確認する</strong></li>
                      <li>余裕があれば、プレイヤー名も保存してJOINで一覧を出す</li>
                    </ol>
                    <p className="assign-h">できたと言える条件</p>
                      <div className="chk-item">サーバを再起動しても戦績が消えない</div>
                      <div className="chk-item">ブラウザ → API → DB の3層を自分で図に描いて説明できる</div>
                      <div className="chk-item">なぜプレースホルダを使うのか説明できる</div>
                      <div className="chk-item">実際にDBファイルを開いて、中のデータを確認した</div>
                    <p className="assign-hint">💡 うまく保存されないときは、まずサーバ側だけで確認します。`/docs` からPOSTしてみて、DBファイルを直接覗いて入っているか見る。ここが動いていればブラウザ側の問題だと切り分けられます。</p>
                  </div>
                  <div className="tip-box">
                    <strong>💡 次章への橋渡し:</strong> これで「動いて、保存される」アプリができました。ただし動くのは自分のPCの中だけです。次章では、これを<strong>誰でもアクセスできる場所に置きます</strong>。
                  </div>
                  <h3>チェックリスト</h3>
                  <div className="chk-item">ブラウザ → API → DB の3層を説明できる</div>
                  <div className="chk-item">PythonからDBに接続してSQLを実行できる</div>
                  <div className="chk-item">サーバを再起動してもデータが残ることを確認した</div>
                  <div className="chk-item">プレースホルダを使う理由を説明できる</div>
                  <div className="chk-item">SQLインジェクションがどう起きるか説明できる</div>
                </div>
                <Quiz items={QUIZ} />
              </div>
            </div>
            <KeywordsPanel keywords={KEYWORDS} />
          </div>

          <div className="flex justify-between mt-8 no-print">
            <a href="ch07.html" className="px-4 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 text-sm">← 第7章 API</a>
            <a href="ch09.html" className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm">第9章 デプロイ →</a>
          </div>
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
