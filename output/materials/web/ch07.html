<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web開発の虎の巻 第7章 - API</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { font-family: 'Yu Gothic UI', 'Yu Gothic', 'YuGothic', sans-serif; }
.prose h3 { font-size:1.1rem; font-weight:700; margin:2.5rem 0 0.75rem; color:#1e3a8a; padding-top:1.5rem; border-top:2px solid #e5e7eb; }
.prose h3:first-child { margin-top:0.5rem; border-top:none; padding-top:0; }
.prose p { margin-bottom:1.1rem; line-height:1.9; color:#374151; }
.prose ul { list-style:disc; padding-left:1.5rem; margin-bottom:1.1rem; }
.prose ul li { margin-bottom:0.5rem; color:#374151; }
.prose ol { list-style:decimal; padding-left:1.5rem; margin-bottom:1.1rem; }
.prose ol li { margin-bottom:0.5rem; color:#374151; }
.kv-box  { background:#eff6ff; border-left:4px solid #3b82f6; padding:1rem 1.25rem; border-radius:0 0.5rem 0.5rem 0; margin:1.75rem 0; line-height:1.8; }
.warn-box{ background:#fff7ed; border-left:4px solid #f97316; padding:1rem 1.25rem; border-radius:0 0.5rem 0.5rem 0; margin:1.75rem 0; line-height:1.8; }
.tip-box { background:#f0fdf4; border-left:4px solid #10b981; padding:1rem 1.25rem; border-radius:0 0.5rem 0.5rem 0; margin:1.75rem 0; line-height:1.8; }
.ex-box  { background:#faf5ff; border:2px dashed #7c3aed; padding:1.1rem 1.25rem; border-radius:0.75rem; margin:1.75rem 0; }
.ex-box .ex-title { font-weight:700; color:#5b21b6; margin-bottom:0.75rem; }
.chk-item { display:flex; gap:0.5rem; padding:0.4rem 0; font-size:0.875rem; color:#374151; align-items:flex-start; }
.chk-item::before { content:"☐"; color:#f97316; font-size:1rem; flex-shrink:0; margin-top:-1px; }
.quiz-option { cursor:pointer; padding:0.5rem 1rem; border:2px solid #e5e7eb; border-radius:0.5rem; margin:0.4rem 0; transition:all 0.2s; }
.quiz-option:hover { border-color:#3b82f6; background:#eff6ff; }
.quiz-option.correct { border-color:#10b981; background:#f0fdf4; color:#065f46; }
.quiz-option.wrong { border-color:#ef4444; background:#fef2f2; color:#991b1b; }
.tag { display:inline-block; padding:0.15rem 0.5rem; border-radius:9999px; font-size:0.7rem; font-weight:600; }
.tag-core { background:#dbeafe; color:#1d4ed8; }
.tag-user { background:#d1fae5; color:#065f46; }
.code-block { background:#111827; color:#f3f4f6; font-family:Consolas, Monaco, monospace; font-size:0.8rem; line-height:1.7; border-radius:0.5rem; padding:1rem 1.25rem; overflow-x:auto; margin:1.25rem 0; white-space:pre; }
.assign-box { background:linear-gradient(135deg,#fff7ed,#fef3c7); border:2px solid #f59e0b; border-radius:0.75rem; padding:1.25rem 1.5rem; margin:2rem 0; }
.assign-title { font-weight:700; font-size:1.05rem; color:#92400e; margin-bottom:0.5rem; }
.assign-goal { color:#78350f; margin-bottom:0.9rem; line-height:1.8; }
.assign-h { font-weight:700; font-size:0.85rem; color:#92400e; margin:0.9rem 0 0.4rem; }
.assign-steps { list-style:decimal; padding-left:1.5rem; margin-bottom:0.5rem; }
.assign-steps li { margin-bottom:0.35rem; color:#451a03; }
.assign-hint { margin-top:0.9rem; font-size:0.85rem; color:#78350f; background:#fffbeb; border-radius:0.5rem; padding:0.6rem 0.8rem; }
.tbl-wrap { overflow-x:auto; margin:1.5rem 0; border:1px solid #e5e7eb; border-radius:0.5rem; }
.tbl { width:100%; border-collapse:collapse; font-size:0.85rem; min-width:480px; }
.tbl-th { background:#1e3a8a; color:#fff; text-align:left; padding:0.6rem 0.8rem; font-weight:600; }
.tbl-td { border-top:1px solid #e5e7eb; padding:0.6rem 0.8rem; vertical-align:top; color:#374151; }
.tbl tbody tr:nth-child(even) { background:#f9fafb; }
@media print { .no-print { display:none; } }
</style>
</head>
<body class="bg-gray-50">
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const KEYWORDS = [
  {
    "term": "API",
    "desc": "プログラム同士がデータをやり取りする窓口"
  },
  {
    "term": "HTTPメソッド",
    "desc": "GET=取得 / POST=追加 / PUT=更新 / DELETE=削除"
  },
  {
    "term": "JSON",
    "desc": "データ交換の標準的なテキスト形式"
  },
  {
    "term": "FastAPI",
    "desc": "PythonでAPIを作るライブラリ。自動でドキュメントも作る"
  },
  {
    "term": "CORS",
    "desc": "別のオリジンからの通信を許可する仕組み。最初に必ず詰まる"
  }
];

const QUIZ = [
  {
    "q": "APIの役割として最も適切なものはどれか。",
    "options": [
      "CSSを自動生成する機能",
      "パソコンの電源を管理する仕組み",
      "ブラウザとサーバがデータをやり取りする窓口",
      "画像を圧縮する機能"
    ],
    "answer": 2,
    "explain": "ブラウザのJavaScriptからサーバのPython関数を直接呼ぶことはできない。間にHTTPとJSONを挟んでやり取りする窓口がAPIである。"
  },
  {
    "q": "ブラウザから別のサーバへ通信したとき「CORS policy」というエラーが出た。この原因として正しいものはどれか。",
    "options": [
      "JSONの書き方が間違っている",
      "インターネット回線が切断されている",
      "サーバのプログラムに文法エラーがある",
      "ブラウザが安全のため別オリジンへの通信を既定で止めている"
    ],
    "answer": 3,
    "explain": "CORSエラーはバグではなくブラウザの正しい動作である。サーバ側で許可するオリジンを設定して解決する。"
  }
];

function KeywordsPanel({ keywords }) {
  if (!keywords || keywords.length === 0) return null;
  return (
    <aside className="w-64 shrink-0 no-print hidden lg:block">
      <div className="sticky top-24 bg-white rounded-xl shadow-sm border border-gray-100 p-4">
        <p className="font-bold text-sm text-blue-900 mb-3">🔑 重要キーワード</p>
        {keywords.map((k, i) => (
          <div key={i} className="mb-3">
            <p className="text-sm font-semibold text-gray-800">{k.term}</p>
            <p className="text-xs text-gray-500 leading-relaxed">{k.desc}</p>
          </div>
        ))}
      </div>
    </aside>
  );
}

function Quiz({ items }) {
  const [answers, setAnswers] = useState({});
  if (!items || items.length === 0) return null;
  return (
    <div className="mt-10 pt-6 border-t-2 border-gray-200">
      <h3 className="text-lg font-bold text-purple-800 mb-4">📝 確認クイズ</h3>
      {items.map((item, qi) => {
        const selected = answers[qi];
        return (
          <div key={qi} className="mb-6">
            <p className="font-semibold text-gray-800 mb-2">Q{qi + 1}. {item.q}</p>
            {item.options.map((opt, oi) => {
              let cls = 'quiz-option';
              if (selected !== undefined) {
                if (oi === item.answer) cls += ' correct';
                else if (oi === selected) cls += ' wrong';
              }
              return (
                <div key={oi} className={cls} onClick={() => setAnswers({ ...answers, [qi]: oi })}>{opt}</div>
              );
            })}
            {selected !== undefined && (
              <p className={"text-sm mt-2 p-3 rounded-lg " + (selected === item.answer ? 'bg-green-50 text-green-800' : 'bg-red-50 text-red-800')}>
                {selected === item.answer ? '⭕ 正解！' : '❌ 不正解。'} {item.explain}
              </p>
            )}
          </div>
        );
      })}
    </div>
  );
}

function Page() {
  return (
    <div className="min-h-screen flex flex-col">
      <header className="bg-gradient-to-r from-blue-900 to-blue-700 text-white shadow-lg no-print sticky top-0 z-10">
        <div className="max-w-7xl mx-auto px-6 py-3 flex items-center gap-3">
          <a href="../../index.html" className="px-2 py-1 rounded hover:bg-white/20 text-sm">← 目次</a>
          <p className="font-bold flex-1">🐯 Web開発の虎の巻</p>
          <p className="text-sm text-blue-200">第7章 / 全11章</p>
        </div>
      </header>

      <div className="max-w-7xl mx-auto w-full flex-1">
        <main className="flex-1 p-6 min-w-0">
          <div className="rounded-2xl p-6 mb-6 text-white shadow-md bg-gradient-to-r from-emerald-700 to-emerald-500">
            <span className="tag bg-white/20 text-white">第7章 · バックエンド</span>
            <h1 className="text-2xl font-bold mt-2">🔌 API</h1>
            <p className="text-emerald-100 mt-1">ブラウザとサーバをつなぐ</p>
          </div>

          <div className="flex gap-6 items-start">
            <div className="flex-1 min-w-0">
              <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 md:p-8">
                <div className="prose">
                  <div className="kv-box">
                    <strong>🎯 この章のゴール:</strong> FastAPIでサーバを立て、<strong>オセロの画面から戦績を送って一覧を取得できる</strong>ようにする。ブラウザとサーバが別プログラムとして動いていることを、目で見て確認する。
                  </div>
                  <h3>いま2つのプログラムがある</h3>
                  <p>ここまでで、ブラウザで動くオセロ（HTML/CSS/JS）と、Pythonで書いたコード、そしてデータベースができました。これらは<strong>それぞれ別の場所で動く、別のプログラム</strong>です。</p>
                  <div className="code-block">{`[ブラウザ]              [サーバ]
HTML/CSS/JS      ？      Python + DB
オセロの画面     ←→      戦績の保存先

この「？」の部分をつなぐのが API`}</div>
                  <p>ブラウザのJavaScriptから、サーバのPythonの関数を直接呼ぶことはできません。<strong>間にHTTPという約束事を挟んで、JSONという形式でデータをやり取りします</strong>。その窓口がAPIです。</p>
                  <h3>窓口の作り方 — URLとメソッド</h3>
                  <p>APIは「どのURLに」「どの方法で」アクセスするかで機能が決まります。</p>
                  <div className="tbl-wrap">
                    <table className="tbl">
                      <thead><tr><th className="tbl-th">メソッド</th><th className="tbl-th">URL</th><th className="tbl-th">やること</th></tr></thead>
                      <tbody>
                        <tr><td className="tbl-td">GET</td><td className="tbl-td">/api/games</td><td className="tbl-td">戦績の一覧を取得する</td></tr>
                        <tr><td className="tbl-td">POST</td><td className="tbl-td">/api/games</td><td className="tbl-td">対戦結果を1件追加する</td></tr>
                        <tr><td className="tbl-td">GET</td><td className="tbl-td">/api/games/3</td><td className="tbl-td">3番の対戦の詳細を取得する</td></tr>
                        <tr><td className="tbl-td">DELETE</td><td className="tbl-td">/api/games/3</td><td className="tbl-td">3番の対戦を削除する</td></tr>
                      </tbody>
                    </table>
                  </div>
                  <div className="tip-box">
                    <strong>💡 前章とのつながり:</strong> この4つは、SQLで学んだ <strong>CRUD</strong>（INSERT / SELECT / UPDATE / DELETE）ときれいに対応します。APIは「外から使えるようにしたCRUD」だと考えると分かりやすくなります。
                  </div>
                  <h3>FastAPIでサーバを書く</h3>
                  <p>PythonでAPIを作るライブラリはいくつかありますが、ここでは <strong>FastAPI</strong> を使います。書く量が少なく、<strong>自動でAPIの説明ページを作ってくれる</strong>のが大きな利点です。</p>
                  <div className="code-block">{`# main.py
from fastapi import FastAPI
from pydantic import BaseModel

app = FastAPI()

# 受け取るデータの形を決めておく
class Game(BaseModel):
    winner: str
    black_count: int
    white_count: int

games = []   # ひとまずメモリに置く（次章でDBに移す）

@app.get("/api/games")
def list_games():
    return games

@app.post("/api/games")
def add_game(game: Game):
    games.append(game)
    return {"ok": True, "count": len(games)}`}</div>
                  <div className="code-block">{`uvicorn main:app --reload      # サーバを起動する
# → http://127.0.0.1:8000 で動く`}</div>
                  <div className="kv-box">
                    <strong>📌 まずは /docs を開くこと:</strong> サーバを起動したら `http://127.0.0.1:8000/docs` を開いてください。<strong>FastAPIが自動で作ったAPIの操作画面</strong>が出ます。ここから実際にデータを送って試せるので、ブラウザ側を書く前に<strong>サーバだけで動作確認できます</strong>。切り分けができるので、詰まったときの強い味方になります。
                  </div>
                  <h3>ブラウザ側から呼ぶ</h3>
                  <p>サーバが動いたら、オセロの画面から呼びます。JavaScriptの `fetch` を使います。</p>
                  <div className="code-block">{`// 対戦が終わったら結果を送る
async function saveResult(winner, black, white) {
  const res = await fetch("http://127.0.0.1:8000/api/games", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      winner: winner,
      black_count: black,
      white_count: white,
    }),
  });
  const data = await res.json();
  console.log("保存しました", data);
}

// 戦績一覧を取ってくる
async function loadHistory() {
  const res = await fetch("http://127.0.0.1:8000/api/games");
  const games = await res.json();
  return games;
}`}</div>
                  <div className="warn-box">
                    <strong>⚠️ ここで必ず CORS エラーが出ます:</strong> ブラウザは安全のため、<strong>別の場所にあるサーバへの通信を既定で止めます</strong>。コンソールに「CORS policy」というエラーが出たら、これです。バグではなくブラウザの正しい動作なので、サーバ側で「このオリジンからは許可する」と設定します。
                  </div>
                  <div className="code-block">{`# main.py に追記
from fastapi.middleware.cors import CORSMiddleware

app.add_middleware(
    CORSMiddleware,
    allow_origins=["*"],      # 学習用。本番では実際のURLを指定する
    allow_methods=["*"],
    allow_headers=["*"],
)`}</div>
                  <h3>詰まったときの切り分け</h3>
                  <p>うまく動かないとき、<strong>ブラウザ側とサーバ側のどちらで失敗しているか</strong>を先に切り分けます。想像で直そうとすると必ず遠回りになります。</p>
                  <ol>
                    <li>`/docs` でサーバ単体を試す → ここで失敗するならサーバ側の問題</li>
                    <li>ブラウザの Network タブを開く → リクエストが飛んでいるか確認する</li>
                    <li>飛んでいるなら、返ってきたステータスを見る（404=URLが違う、422=送ったデータの形が違う、500=サーバ側でエラー）</li>
                    <li>サーバを起動したターミナルを見る → Pythonのエラーが出ていないか</li>
                  </ol>
                  <div className="assign-box">
                    <p className="assign-title">🛠 課題: オセロの戦績をサーバに送る</p>
                    <p className="assign-goal">FastAPIでAPIを作り、オセロの画面から実際に呼びます。ブラウザとサーバという<strong>2つのプログラムが通信している</strong>ことを、自分の目で確認するのが狙いです。</p>
                    <p className="assign-h">作るもの</p>
                    <ol className="assign-steps">
                      <li>FastAPIを入れ、main.py を作ってサーバを起動する</li>
                      <li>`/docs` を開き、画面から戦績を1件登録してみる</li>
                      <li>GET /api/games と POST /api/games を作る</li>
                      <li>オセロ側で、対戦が終わったら結果を自動でPOSTする</li>
                      <li>「戦績一覧」ボタンを作り、GETした結果を画面に表示する</li>
                      <li>CORSエラーを解決する</li>
                    </ol>
                    <p className="assign-h">できたと言える条件</p>
                      <div className="chk-item">オセロで対戦を終えると、サーバにデータが届く</div>
                      <div className="chk-item">一覧ボタンで過去の戦績が表示される</div>
                      <div className="chk-item">Networkタブでリクエストとレスポンスの中身を説明できる</div>
                      <div className="chk-item">サーバを止めると画面側でどうなるか確認した</div>
                    <p className="assign-hint">💡 いきなりオセロに組み込まず、まず `/docs` でサーバだけ動かして確認してください。サーバが正しいと分かっていれば、あとはブラウザ側だけを疑えばよくなります。</p>
                  </div>
                  <div className="warn-box">
                    <strong>⚠️ まだデータは消えます:</strong> いまの状態では、戦績はPythonの変数（メモリ）に入っているだけです。<strong>サーバを再起動すると全部消えます</strong>。次章でDBに繋いで、本当に保存されるようにします。
                  </div>
                  <h3>チェックリスト</h3>
                  <div className="chk-item">GET / POST / PUT / DELETE の使い分けが分かる</div>
                  <div className="chk-item">FastAPIでエンドポイントを作れる</div>
                  <div className="chk-item">/docs でサーバ単体の動作確認ができる</div>
                  <div className="chk-item">fetchでAPIを呼んで結果を画面に出せる</div>
                  <div className="chk-item">CORSエラーの原因を説明できる</div>
                  <div className="chk-item">ブラウザ側とサーバ側のどちらで失敗しているか切り分けられる</div>
                </div>
                <Quiz items={QUIZ} />
              </div>
            </div>
            <KeywordsPanel keywords={KEYWORDS} />
          </div>

          <div className="flex justify-between mt-8 no-print">
            <a href="ch06.html" className="px-4 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 text-sm">← 第6章 SQL</a>
            <a href="ch08.html" className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm">第8章 DB連携 →</a>
          </div>
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
