<body class="bg-gray-50">
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const KEYWORDS = [
  {
    "term": "TypeScript",
    "desc": "JavaScriptに型を追加した言語。JSに変換されて動く"
  },
  {
    "term": "型注釈",
    "desc": "変数や引数に「: number」のように型を書くこと"
  },
  {
    "term": "型推論",
    "desc": "書かなくてもTypeScriptが型を推測してくれる仕組み"
  },
  {
    "term": "interface",
    "desc": "オブジェクト（データ）の形を定義する仕組み"
  },
  {
    "term": "ユニオン型",
    "desc": "「AかBのどちらか」を表す型。取りうる値を絞れる"
  },
  {
    "term": "any",
    "desc": "何でも入る型。使うと型の恩恵が消える"
  },
  {
    "term": "コンパイル",
    "desc": "TypeScriptをJavaScriptに変換すること"
  },
  {
    "term": "型エラー",
    "desc": "型が合わないときにエディタが出す警告。実行前に気付ける"
  }
];

const QUIZ = [
  {
    "q": "TypeScriptの説明として正しいものはどれか。",
    "options": [
      "JavaScriptとは無関係の全く新しい言語",
      "JavaScriptに型を追加した言語でJavaScriptに変換されて動く",
      "データベース専用の言語",
      "HTMLの新しいバージョン"
    ],
    "answer": 1,
    "explain": "TypeScriptはJavaScriptの上位互換でありコンパイルするとJavaScriptになるため既存の知識がそのまま活きる。"
  },
  {
    "q": "型注釈がある一番の利点はどれか。",
    "options": [
      "実行する前に間違いに気付ける",
      "デザインが自動で良くなる",
      "サーバー代が安くなる",
      "コードの実行速度が2倍になる"
    ],
    "answer": 0,
    "explain": "型があるとエディタが書いた瞬間に間違いを指摘してくれるため実行して初めてバグに気付くことが減る。"
  },
  {
    "q": "オブジェクトの形（どんな項目を持つか）を定義するTypeScriptの仕組みはどれか。",
    "options": [
      "import",
      "function",
      "const",
      "interface"
    ],
    "answer": 3,
    "explain": "interfaceでデータの形を決めておくと、存在しない項目を参照したときにエディタが警告してくれる。APIから受け取るデータの形を定義するのに使う。"
  },
  {
    "q": "石の色のように取りうる値が決まっているものに string 型を使うと起きる問題はどれか。",
    "options": [
      "日本語が使えなくなる",
      "「黒」でも「くろ」でも「BLACK」でも通ってしまう",
      "文字列が長すぎるとエラーになる",
      "実行速度が極端に遅くなる"
    ],
    "answer": 1,
    "explain": "取りうる値が限られているものは専用の型を作ると、想定外の値をエディタが弾いてくれる。型を細かく決めるほど間違いを早く見つけられる。"
  },
  {
    "q": "すでに動いているオセロをTypeScriptに書き換える学習効果として適切なものはどれか。",
    "options": [
      "書き換えると必ずバグがなくなるため",
      "JavaScriptのコードが不要になるため",
      "動くものがある状態で型を入れるため、型の効果が差分として分かりやすい",
      "TypeScriptでないとオセロは作れないため"
    ],
    "answer": 2,
    "explain": "ゼロから型付きで書くより、動くコードに型を足すほうが「型があると何が変わるか」を体感しやすい。発展章として位置づけている理由でもある。"
  }
];

// クリックでチェックできるリスト。状態は localStorage に残すので、
// ページを閉じて開き直しても消えない（章ごと・項目ごとに保存）。
function CheckList({ items }) {
  const storeKey = 'cot-check-ch10';
  const [checked, setChecked] = useState(() => {
    try {
      return JSON.parse(localStorage.getItem(storeKey) || '{}');
    } catch (e) {
      return {};
    }
  });
  const toggle = (text) => {
    const next = { ...checked, [text]: !checked[text] };
    setChecked(next);
    try {
      localStorage.setItem(storeKey, JSON.stringify(next));
    } catch (e) {
      /* 保存できなくても表示は動かす */
    }
  };
  return (
    <div className="chk-list">
      {items.map((text, i) => (
        <label key={i} className={"chk-item" + (checked[text] ? ' done' : '')}>
          <input type="checkbox" checked={!!checked[text]} onChange={() => toggle(text)} />
          <span>{text}</span>
        </label>
      ))}
    </div>
  );
}

function KeywordsPanel({ keywords }) {
  if (!keywords || keywords.length === 0) return null;
  return (
    <aside className="w-64 shrink-0 no-print hidden lg:block">
      <div className="sticky top-24 bg-white rounded-xl shadow-sm border border-gray-100 p-4">
        <p className="font-bold text-sm text-blue-900 mb-3">🔑 重要キーワード</p>
        {keywords.map((k, i) => (
          <div key={i} className="mb-3">
            <p className="text-sm font-semibold text-gray-800">{k.term}</p>
            <p className="text-xs text-gray-500 leading-relaxed">{k.desc}</p>
          </div>
        ))}
      </div>
    </aside>
  );
}

function Quiz({ items }) {
  const [answers, setAnswers] = useState({});
  if (!items || items.length === 0) return null;
  return (
    <div className="mt-10 pt-6 border-t-2 border-gray-200">
      <h3 className="text-lg font-bold text-purple-800 mb-4">📝 確認クイズ</h3>
      {items.map((item, qi) => {
        const selected = answers[qi];
        return (
          <div key={qi} className="mb-6">
            <p className="font-semibold text-gray-800 mb-2">Q{qi + 1}. {item.q}</p>
            {item.options.map((opt, oi) => {
              let cls = 'quiz-option';
              if (selected !== undefined) {
                if (oi === item.answer) cls += ' correct';
                else if (oi === selected) cls += ' wrong';
              }
              return (
                <div key={oi} className={cls} onClick={() => setAnswers({ ...answers, [qi]: oi })}>{opt}</div>
              );
            })}
            {selected !== undefined && (
              <p className={"text-sm mt-2 p-3 rounded-lg " + (selected === item.answer ? 'bg-green-50 text-green-800' : 'bg-red-50 text-red-800')}>
                {selected === item.answer ? '⭕ 正解！' : '❌ 不正解。'} {item.explain}
              </p>
            )}
          </div>
        );
      })}
    </div>
  );
}

function Page() {
  return (
    <div className="min-h-screen flex flex-col">
      <header className="bg-gradient-to-r from-blue-900 to-blue-700 text-white shadow-lg no-print sticky top-0 z-10">
        <div className="max-w-7xl mx-auto px-6 py-3 flex items-center gap-3">
          <a href="../../index.html" className="px-2 py-1 rounded hover:bg-white/20 text-sm">← 目次</a>
          <p className="font-bold flex-1">🐯 Web開発の虎の巻</p>
          <p className="text-sm text-blue-200">第10章 / 全11章</p>
        </div>
      </header>

      <div className="max-w-7xl mx-auto w-full flex-1">
        <main className="flex-1 p-6 min-w-0">
          <div className="rounded-2xl p-6 mb-6 text-white shadow-md bg-gradient-to-r from-violet-700 to-violet-500">
            <span className="tag bg-white/20 text-white">第10章 · 発展</span>
            <h1 className="text-2xl font-bold mt-2">🔷 TypeScript</h1>
            <p className="text-violet-100 mt-1">型でオセロを安全にする（発展）</p>
          </div>

          <div className="flex gap-6 items-start">
            <div className="flex-1 min-w-0">
              <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 md:p-8">
                <div className="prose">
                  <div className="kv-box">
                    <strong>🎯 この章のゴール:</strong> 「型があると実行する前に間違いに気付ける」価値を体感し、基本の型注釈とinterfaceを書けるようになる。<strong>完成したオセロを型付きに書き直す</strong>のが課題です。
                  </div>
                  <h3>TypeScriptとは何か</h3>
                  <p>TypeScriptは、JavaScriptに<strong>型</strong>を追加した言語です。書いたコードはJavaScriptに変換されて動きます。つまり「JavaScriptの上位互換」で、これまで学んだ文法はそのまま使えます。</p>
                  <p>型とは「<strong>この変数には何が入るか</strong>」の宣言です。数値なのか、文字列なのか、あるオブジェクトなのか。それを書いておくと、違うものを入れようとした瞬間にエディタが教えてくれます。</p>
                  <h3>なぜ型が要るのか — オセロで起きたこと</h3>
                  <p>抽象的な説明より、実際に起きやすいバグを見たほうが早いです。次のコードは<strong>JavaScriptでは何のエラーも出ません</strong>。</p>
                  <div className="code-block">{`// 石を置く関数（片方が書いた）
function putStone(row, col, color) {
  board[row][col] = color;
}

// 呼ぶ側（もう片方が書いた）
putStone(3, 4, "黒");      // ある人は日本語で
putStone("3", "4", "black"); // 別の人は文字列と英語で

// 数える側
function countBlack() {
  // "black" で数えている → 日本語の "黒" は数えられない
}`}</div>
                  <p>2人で開発していると、<strong>こういう食い違いが必ず起きます</strong>。しかもJavaScriptは何も言わずに動くので、「なぜか石数が合わない」という形で、ずっと後になってから発覚します。原因を探すのに何時間もかかることがあります。</p>
                  <div className="kv-box">
                    <strong>📌 型は「相方への約束」でもある:</strong> 型を書くということは、<strong>「この関数はこういうものを受け取ります」と明文化する</strong>ことです。共同開発では、相手のコードを全部読まなくても、型を見れば使い方が分かります。第4章でやった共同開発の苦労を、型が減らしてくれます。
                  </div>
                  <h3>型注釈の基本</h3>
                  <div className="code-block">{`let count: number = 0;
let name: string = '田中';
let done: boolean = false;
let tags: string[] = ['html', 'css'];

function add(a: number, b: number): number {
  return a + b;
}

add(1, 2);      // OK
add('1', '2');  // ← 実行する前にエラーで教えてくれる！`}</div>
                  <p>関数の <code>): number</code> の部分は<strong>戻り値の型</strong>です。「この関数は必ず数値を返す」と宣言しています。書いておくと、うっかり <code>return</code> を忘れた場合もエラーで気付けます。</p>
                  <h3>全部に型を書く必要はない</h3>
                  <p>最初は「毎回書くのは面倒」と感じるはずです。実は<strong>書かなくてよい場面が多い</strong>——TypeScriptが自動で推測してくれるからです。これを型推論と呼びます。</p>
                  <div className="code-block">{`let count = 0;          // number だと自動で分かる（書かなくてよい）
let name = '田中';      // string だと分かる

count = "あ";           // ← それでもここでエラーになる

// 一方、引数は推論できないので書く必要がある
function double(n: number) {
  return n * 2;         // 戻り値は number だと推論される
}`}</div>
                  <div className="tip-box">
                    <strong>💡 書くべき場所は「境界」:</strong> 目安は、<strong>関数の引数と、外から入ってくるデータ</strong>です。中の変数はほとんど推論に任せて構いません。型を書く量が減ると、TypeScriptは急に快適になります。
                  </div>
                  <h3>interface — データの形を決める</h3>
                  <div className="code-block">{`interface User {
  id: number;
  name: string;
  email: string;
}

function showUser(user: User) {
  console.log(user.name);
  console.log(user.mail);  // ← 「mailは存在しない」と教えてくれる
}`}</div>
                  <p>これが特に効くのが、<strong>第7章で作ったAPIから返ってくるデータ</strong>です。どんな形で返ってくるかを1か所に書いておけば、以降は打ち間違いをすべてエディタが止めてくれます。</p>
                  <div className="code-block">{`interface GameRecord {
  id: number;
  winner: string;
  black_count: number;
  white_count: number;
  played_at: string;
  memo?: string;          // ? は「無いかもしれない」
}

async function loadHistory(): Promise<GameRecord[]> {
  const res = await fetch("/api/games");
  return await res.json();
}

const games = await loadHistory();
games[0].black_cnt;    // ← 打ち間違いをその場で指摘してくれる`}</div>
                  <h3>ユニオン型 — 取りうる値を絞る</h3>
                  <p>冒頭の「黒 / black / くろ」問題を根本から防ぐ書き方があります。<strong>取りうる値そのものを型にする</strong>のです。</p>
                  <div className="code-block">{`type StoneColor = "black" | "white";     // このどちらか以外は許さない

function putStone(row: number, col: number, color: StoneColor) {
  board[row][col] = color;
}

putStone(3, 4, "black");   // OK
putStone(3, 4, "黒");      // ← エラー。ここで止まる
putStone(3, 4, "Black");   // ← エラー。大文字違いも止まる`}</div>
                  <div className="kv-box">
                    <strong>📌 これがTypeScriptのいちばん強い使い方:</strong> <code>string</code> にしておくと、あらゆる文字列が通ってしまいます。<strong>取りうる値が決まっているものは、その値だけを型にする</strong>。こうすると、間違った値が入る余地そのものが消えます。手番（<code>"black" | "white"</code>）、マスの状態（<code>0 | 1 | 2</code>）など、オセロには使える場所がたくさんあります。
                  </div>
                  <h3>any — 使うと全部台無しになる型</h3>
                  <p>型エラーに困ったとき、<code>any</code> を書くと黙ります。<strong>が、これは型チェックを放棄する宣言です</strong>。</p>
                  <div className="code-block">{`let data: any = await res.json();
data.whatever.anything;      // 何を書いてもエラーにならない（実行時に落ちる）`}</div>
                  <div className="warn-box">
                    <strong>⚠️ anyで黙らせるのは最後の手段:</strong> エラーが出ると <code>any</code> を書きたくなりますが、<strong>それをやると型を入れた意味が消えます</strong>。TypeScriptを入れたのに全部 any、というコードは実務でもよく見かけますが、手間だけ増えて利点がゼロの状態です。まずはエラーメッセージを読んで、正しい型を考えてください。
                  </div>
                  <h3>導入と実行</h3>
                  <p>すでにあるJSファイルを <code>.ts</code> に変えるところから始められます。段階的に移せるのがTypeScriptの良いところです。</p>
                  <div className="code-block">{`npm install -D typescript      # 導入
npx tsc --init                 # 設定ファイル tsconfig.json を作る
npx tsc                        # .ts → .js に変換（コンパイル）
npx tsc --watch                # 保存のたびに自動変換`}</div>
                  <p>変換して出てきた <code>.js</code> をHTMLから読み込みます。<strong>ブラウザはTypeScriptをそのままでは実行できない</strong>ので、この変換が必ず要ります。次章で使うViteのようなツールを入れると、この手順は自動になります。</p>
                  <h3>型エラーの読み方</h3>
                  <p>TypeScriptのエラー文は長く見えますが、読むところは<strong>「何が」「どの型と」合わないか</strong>の2点だけです。</p>
                  <div className="code-block">{`Argument of type 'string' is not assignable to parameter of type 'number'.
   └ 渡したもの: string        └ 求められているもの: number

Property 'mail' does not exist on type 'User'. Did you mean 'email'?
   └ 無いもの: mail                          └ もしかして: email`}</div>
                  <div className="tbl-wrap">
                    <table className="tbl">
                      <thead><tr><th className="tbl-th">エラーの言い回し</th><th className="tbl-th">意味</th></tr></thead>
                      <tbody>
                        <tr><td className="tbl-td">is not assignable to</td><td className="tbl-td">その型は入れられない</td></tr>
                        <tr><td className="tbl-td">does not exist on type</td><td className="tbl-td">その名前はその型に無い（打ち間違い）</td></tr>
                        <tr><td className="tbl-td">Object is possibly 'undefined'</td><td className="tbl-td">無いかもしれないので、確認してから使う必要がある</td></tr>
                        <tr><td className="tbl-td">Did you mean …?</td><td className="tbl-td">似た名前の候補。だいたい正解</td></tr>
                      </tbody>
                    </table>
                  </div>
