# GitHub Pages へのデプロイ（Actions 方式）
#
# 公開に必要なファイルだけを _site に集めてからアップロードする。
# リポジトリ全体（scripts / input / .claude など）を配信する必要はないため。

name: Deploy to GitHub Pages

# GitHub Pages には「1時間あたり10回」のデプロイ制限がある。
# push のたびに走らせると、まとめて作業した日に制限へ当たって
# 「どの回も反映されない」状態になる（実際に14回連続で失敗した）。
# そのため自動デプロイはやめ、公開したいときだけ手動で実行する。
#   gh workflow run pages.yml --repo sasakiyusuke2017015/cot
# または GitHub の Actions 画面から「Run workflow」。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 連続 push したとき、古い実行は捨てて最新だけを通す。
# cancel-in-progress: false だと後続が待たされ、待機上限でキャンセルされて
# 「どの実行も反映されない」状態になっていた。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Collect public files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp .nojekyll _site/ 2>/dev/null || true
          cp -r output _site/
          echo "--- 配信するファイル ---"
          find _site -type f | sort
          echo "--- 合計 ---"
          find _site -type f | wc -l

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # デプロイ自体は成功するのに、完了の検知が終わらずタイムアウト → その回の内容が
      # キャンセルされる事象が続いた。待たずに投げっぱなしにして、反映は別途確認する。
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 30
        continue-on-error: true
        with:
          timeout: 1800000
          error_count: 30

      - name: 反映確認
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          url="${url:-https://sasakiyusuke2017015.github.io/cot/}"
          echo "確認先: $url"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo 000)
            echo "  [$i] $code"
            [ "$code" = "200" ] && { echo "公開を確認しました: $url"; exit 0; }
            sleep 20
          done
          echo "::warning::公開が確認できませんでした（後で $url を直接確認してください）"
