# GitHub Pages へのデプロイ（Actions 方式）
#
# 公開に必要なファイルだけを _site に集めてからアップロードする。
# リポジトリ全体（scripts / input / .claude など）を配信する必要はないため。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Collect public files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp .nojekyll _site/ 2>/dev/null || true
          cp -r output _site/
          echo "--- 配信するファイル ---"
          find _site -type f | sort
          echo "--- 合計 ---"
          find _site -type f | wc -l

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 20
