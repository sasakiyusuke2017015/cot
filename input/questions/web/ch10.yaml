questions:
  - learning_item: TypeScript
    stem: TypeScriptの説明として正しいものはどれか。
    correct: JavaScriptに型を追加した言語でJavaScriptに変換されて動く
    wrongs:
      - JavaScriptとは無関係の全く新しい言語
      - HTMLの新しいバージョン
      - データベース専用の言語
    explanation: TypeScriptはJavaScriptの上位互換でありコンパイルするとJavaScriptになるため既存の知識がそのまま活きる。
    keywords: [TypeScript, 型, JavaScript]
  - learning_item: TypeScript
    stem: 型注釈がある一番の利点はどれか。
    correct: 実行する前に間違いに気付ける
    wrongs:
      - コードの実行速度が2倍になる
      - デザインが自動で良くなる
      - サーバー代が安くなる
    explanation: 型があるとエディタが書いた瞬間に間違いを指摘してくれるため実行して初めてバグに気付くことが減る。
    keywords: [TypeScript, 型注釈, エラー検出]
