source_refs:
  - input/raw/web-dev/mentoring-notes.md
questions:
  - learning_item: DB連携
    stem: Webアプリの3層構成におけるAPIの位置づけはどれか。
    correct: ブラウザとDBの橋渡しをする
    wrongs:
      - DBの中に保存されるデータの一種
      - 画面のデザインを決める層
      - インターネット回線そのもの
    explanation: ブラウザ（画面）→API（橋渡し）→DB（保存先）という3層がWebアプリの基本形である。この絵が描ければ全体像を理解できたと言える。
    keywords: [DB, 3層構成, API]
  - learning_item: DB連携
    stem: SQLに値を埋め込むとき、プレースホルダ（? など）を使う理由はどれか。
    correct: 文字列連結だとSQLインジェクションで乗っ取られる危険があるため
    wrongs:
      - 文字列連結よりも実行速度が速くなるため
      - SQLの文字数制限を回避するため
      - データベースの容量を節約するため
    explanation: ユーザー入力を文字列連結でSQLに埋め込むと、入力次第で条件を無意味にされたりテーブルを削除されたりする。入力値は必ずプレースホルダで渡す。
    keywords: [SQLインジェクション, プレースホルダ, セキュリティ]
  - learning_item: DB連携
    stem: APIをDBに繋いだことで変わる点として正しいものはどれか。
    correct: サーバを再起動してもデータが残るようになる
    wrongs:
      - 通信速度が必ず速くなる
      - CORSの設定が不要になる
      - JavaScriptを書かなくてよくなる
    explanation: 変数（メモリ）に置いたデータは実行が終われば消える。DBに保存することで初めて「保存した」と言える状態になる。
    keywords: [DB連携, 永続化, 再起動]
  - learning_item: DB連携
    stem: "name の値に  ' OR '1'='1  を入れられたとき、文字列連結で組み立てたSQLはどうなるか。"
    correct: 条件が常に真になり、全件が返ってしまう
    wrongs:
      - 構文エラーになって安全に停止する
      - 該当0件として何も返らない
      - 自動でエスケープされ問題は起きない
    explanation: 入力がSQLの一部として解釈されるため条件が無意味になる。さらに悪意ある入力ではテーブルの削除も可能になる。プレースホルダを使えば値として扱われるため安全。
    keywords: [SQLインジェクション, セキュリティ, 攻撃]
  - learning_item: DB連携
    stem: ORMを使う前に生のSQLを学んでおくべき理由はどれか。
    correct: 詰まったときにORMが出しているSQLを確認して原因を追えるため
    wrongs:
      - ORMは生SQLより動作が遅いため
      - ORMは実務では使われないため
      - 生SQLのほうが記述量が少なくなるため
    explanation: ORMは便利だが中で何が起きているか分からないまま使うと問題解決ができない。仕組みを理解してから道具を使う順番が大事。
    keywords: [ORM, SQL, 学習順序]
