source_refs:
  - input/raw/web-dev/mentoring-notes.md
questions:
  - learning_item: デプロイ
    stem: 「デプロイ」の意味として正しいものはどれか。
    correct: アプリを公開して誰でも使える状態にすること
    wrongs:
      - コードを削除すること
      - デザインを修正すること
      - パソコンを初期化すること
    explanation: デプロイは作ったアプリをサーバーに配置して公開することであり学習の総仕上げにあたる。
    keywords: [デプロイ, 公開, ホスティング]
  - learning_item: デプロイ
    stem: 今どきの典型的なWebアプリ公開の流れはどれか。
    correct: GitHubへpushするとホスティングサービスが自動で公開する
    wrongs:
      - USBメモリでサーバー室に運ぶ
      - コードを印刷して郵送する
      - HTMLをメールで全員に送る
    explanation: VercelなどのサービスはGitHub連携によりpushのたびに自動でビルド・公開してくれる。Gitの習慣がここで直接活きる。
    keywords: [デプロイ, GitHub, 自動化]
  - learning_item: デプロイ
    stem: 公開する前に必ず確認すべきことはどれか。
    correct: APIキーやパスワードがコードに残っていないか
    wrongs:
      - コメントが日本語で書かれているか
      - 変数名が英語になっているか
      - ファイル数が少なくまとまっているか
    explanation: 公開すると誰でもアクセスできる状態になる。秘密情報は環境変数に移し、コードやリポジトリに残さない。
    keywords: [デプロイ, 環境変数, セキュリティ]
  - learning_item: デプロイ
    stem: フロントエンドを公開したあと、APIに繋がらなくなった。確認すべき点として適切な組み合わせはどれか。
    correct: フロント側のAPI接続先URLと、サーバ側のCORS許可設定
    wrongs:
      - HTMLの文法エラーとCSSの読み込み順
      - データベースの容量とテーブル名
      - ブラウザのバージョンと画面サイズ
    explanation: ローカルのURLのままだと繋がらず、公開したフロントのURLをCORSで許可していないとブラウザに止められる。第7章の切り分け手順がそのまま使える。
    keywords: [デプロイ, CORS, API接続]
  - learning_item: デプロイ
    stem: 学習においてデプロイまで行う意義として最も適切なものはどれか。
    correct: 公開URLを人に使ってもらう経験が次の学習の原動力になる
    wrongs:
      - デプロイしないとコードが保存されないため
      - 公開しないとプログラムが動作しないため
      - 就職活動で必須の資格になるため
    explanation: 動くものを世界に出した経験は学習のモチベーションを大きく変える。作って終わりではなく、使ってもらって感想をもらうところまでが一区切りになる。
    keywords: [デプロイ, モチベーション, 学習]
