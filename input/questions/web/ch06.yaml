source_refs:
  - input/raw/web-dev/mentoring-notes.md
questions:
  - learning_item: SQL
    stem: テーブルを設計するとき、最初に決めるべき最も大事なことはどれか。
    correct: その表の1行が何を表しているか
    wrongs:
      - 列の並び順をどうするか
      - テーブル名を英語にするか日本語にするか
      - 何件のデータが入る予定か
    explanation: 「${正答1}」が曖昧なまま作ると後で必ず破綻する。戦績テーブルなら「1行=1回の対戦」のように一言で言えるようにする。
    keywords: [SQL, テーブル設計, 主キー]
  - learning_item: SQL
    stem: DELETE 文を書くときに特に注意すべきことはどれか。
    correct: WHERE を忘れると全行が消えてしまう
    wrongs:
      - 実行に時間がかかるので夜間に実行する
      - 1度に1行しか削除できない
      - 削除したデータは自動でバックアップされる
    explanation: WHERE無しのDELETEやUPDATEは全行が対象になる。実行前に同じ条件でSELECTして対象を確認する癖をつけるとよい。
    keywords: [SQL, DELETE, WHERE]
