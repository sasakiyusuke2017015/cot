# 試験問題（lv0 第1章）。purpose: cert → lv0-cert.csv に集約される。
# 判断・シナリオ寄りで難度高め。確認問題と重複させない。
questions:
  - level: lv0
    purpose: cert
    type: judgment
    difficulty: intermediate
    learning_item: ハルシネーション、人間確認
    stem: AIが生成した文章を社外向け資料に使う前の対応として、最も適切なものはどれか。
    correct: 重要な事実・数値は一次情報で確認してから使う
    wrongs:
      - 文章が流暢であればそのまま使ってよい
      - AIが生成したものなので確認は不要
      - 誤りがあってもAIの責任なので気にしない
    explanation: |
      【${正答1}】ハルシネーションの可能性があるため、重要な事実・数値は一次情報で確認します。
      【${誤答1}が誤りの理由】流暢さと正確さは別物です。
      【${誤答2}が誤りの理由】確認不要は誤りで、人間の最終確認が必要です。
      【${誤答3}が誤りの理由】社外向け資料の責任は利用者側にあります。
    source_refs:
      - input/materials/lv0/ch01.yaml

  - level: lv0
    purpose: cert
    type: scenario
    difficulty: practical
    learning_item: AIの得意不得意、業務判断
    stem: 「社内会議の議事録を要約したい」という業務について、最も適切な判断はどれか。
    correct: 要約はAIの得意領域なので、まず試したうえで人が内容を確認する
    wrongs:
      - 機密情報を含むため、AIには一切触れさせず手作業のみで行う
      - AIに任せれば完璧なので、確認せずそのまま配布する
      - 議事録の要約はAIには原理的に不可能である
    explanation: |
      【${正答1}】要約はAIの得意領域です。まず試し、人が最終確認するのが適切です（機密の扱いは別途配慮）。
      【${誤答1}が誤りの理由】配慮は必要ですが「一切不可」は過剰で、得意領域を放棄しています。
      【${誤答2}が誤りの理由】無確認の配布はハルシネーションのリスクがあります。
      【${誤答3}が誤りの理由】要約はAIが得意とするタスクです。
    source_refs:
      - input/materials/lv0/ch01.yaml
