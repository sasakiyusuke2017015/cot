# 確認問題（lv0 第1章）。purpose: check → lv0-check.csv に集約される。
# 正解位置は書かない（provision がシャッフル）。correct 1 + wrongs 3。
questions:
  - level: lv0
    purpose: check
    learning_item: AIブーム、機械学習、生成AI
    stem: 「AIブーム」の説明として最も適切なものはどれか。
    correct: AIへの注目・研究が高まった時期のことで、これまでに3回起きている
    wrongs:
      - AIが実用化された時期のことで、現在進行中の第3次のみを指す
      - AIが政府によって公式に認められた時期のこと
      - コンピュータがインターネットに接続できるようになった時期のこと
    explanation: |
      【${正答1}】AIブームとは「AIへの注目・研究が高まった時期」で、第1次・第2次・第3次の計3回起きています。
      【${誤答1}が誤りの理由】第3次のみを指すとしており誤りです。3回すべてを含みます。
      【${誤答2}が誤りの理由】政府の公認とAIブームは無関係です。
      【${誤答3}が誤りの理由】インターネット接続とAIブームは別概念です。
    source_refs:
      - input/materials/lv0/ch01.yaml

  - level: lv0
    purpose: check
    learning_item: 機械学習
    stem: 「機械学習」の説明として最も適切なものはどれか。
    correct: コンピュータが大量のデータを分析し、パターンやルールを自分で見つけ出す技術
    wrongs:
      - 人間がすべてのルールを事前に教え込むプログラミング手法
      - AIが工場の機械を自動操作する技術
      - コンピュータ同士がネットワーク上で情報を共有する仕組み
    explanation: |
      【${正答1}】機械学習はデータからパターンを自分で見つけ出す技術です。
      【${誤答1}が誤りの理由】人手で全ルールを教える従来手法とは逆です。
      【${誤答2}が誤りの理由】機械の自動操作は機械学習の定義ではありません。
      【${誤答3}が誤りの理由】ネットワーク共有は機械学習と無関係です。
    source_refs:
      - input/materials/lv0/ch01.yaml

  - level: lv0
    purpose: check
    learning_item: ハルシネーション
    stem: 「ハルシネーション」の説明として最も適切なものはどれか。
    correct: AIが事実でない情報を、あたかも正しいかのように生成してしまう現象
    wrongs:
      - AIの処理速度が一時的に低下する現象
      - AIが学習データを丸ごと暗記してしまう現象
      - AIが画像を生成できなくなる不具合
    explanation: |
      【${正答1}】ハルシネーションは事実でない内容を正しいかのように生成する現象です。重要情報は一次情報で確認します。
      【${誤答1}が誤りの理由】速度低下は別の問題です。
      【${誤答2}が誤りの理由】暗記（過学習）とは別概念です。
      【${誤答3}が誤りの理由】画像生成の不具合とは関係ありません。
    source_refs:
      - input/materials/lv0/ch01.yaml
