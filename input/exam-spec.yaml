# 試験問題バンク（cert）と模擬試験の設計。/generate-exam-bank と /assemble-exam が参照。
exam:
  lv0:
    title: AIリテラシー入門 認定試験
    total_questions: 30
    time_limit_minutes: 40
    passing_score_percent: 70
  lv1:
    title: 生成AI活用ガイド 認定試験
    total_questions: 40
    time_limit_minutes: 50
    passing_score_percent: 70

question_bank:
  choices_per_question: 4
  # 正解位置は書かない（provision-question-bank.mjs が seed_ref から決定的にシャッフル）

# バンク作成時の配分（割合の目安）
distribution:
  by_difficulty:
    basic: 0.4
    intermediate: 0.35
    practical: 0.25
  by_type:
    knowledge: 0.35
    judgment: 0.30
    scenario: 0.20
    prompt: 0.15

rules:
  single_correct_answer_only: true
  include_explanation: true
  avoid_ambiguous_questions: true
  separate_student_exam_and_answer_key: true
