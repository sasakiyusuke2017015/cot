# コース全体の設計。/generate-* スキルが参照する。
course:
  title: 社内AI活用資格 研修教材
  audience: 全社員
  language: ja

# ai_edu のレベル規約に一致させること。
levels:
  lv0:
    course_title: AIリテラシー入門
    goal: AIに振り回されず、安全に使うための基礎を身につける
    default_chapter_count: 6
  lv1:
    course_title: 生成AI活用ガイド
    goal: 生成AIを業務で実践的に活用できるようになる
    default_chapter_count: 7

generation:
  check_questions_per_chapter: 3   # 確認問題（lvN-check.csv）
  cert_bank_target_per_level: 60   # 試験問題バンク（lvN-cert.csv）

chapter_types:
  core:  { label: 知識, desc: AI基礎・背景知識・リスク理解 }
  user:  { label: 実践, desc: 業務活用・プロンプト・判断演習 }
  check: { label: 確認テスト, desc: ハブ型 index.html 内の確認章 }

rules:
  use_images: false
  choices_per_question: 4      # 1 正解 + 3 誤答
  answer_shuffled_at_provision: true  # 正解位置は provision-question-bank.mjs が決める
  material_format: ai-certificate-html

# 出力先（ai_edu）。AI_EDU_DIR 環境変数で上書き可。
output:
  ai_edu_dir_default: ../ai_edu
  materials_subdir: packages/db/seeds/materials
  questions_subdir: packages/db/seeds/questions
