id: 1
level: web
type: frontend
icon: "🏗️"
title: HTML
subtitle: ページの骨組みを作る
source_refs:
  - input/raw/web-dev/mentoring-notes.md
# 講師向け（index.html のカンペに出る。生徒向けHTMLには出ない）
teaching:
  sessions: 2
  goal: タグで構造を書く感覚をつかませる。見た目の話はまだしない。
  watch: 見た目を整えたがるので「それは次章」と切る。閉じタグ忘れは自分で気付かせる。
  ask: なぜここは div ではなく h1 にした？
keywords:
  - term: HTML
    desc: Webページの構造（骨組み）を記述する言語
  - term: タグ
    desc: 要素の始まりと終わりを示す目印。<p>〜</p> のように書く
  - term: 要素
    desc: タグで挟まれたページの構成単位。見出し・段落など
  - term: 属性
    desc: 要素に追加する情報。href や src など
  - term: 開発者ツール
    desc: ブラウザ内蔵の解析ツール。右クリック→検証で開く
content_blocks:
  - kind: kv-box
    title: "🎯 この章のゴール:"
    text: HTMLが「見た目」ではなく「構造」を書く言語だと理解し、基本のタグでページの骨組みを作れるようになる。
  - kind: h3
    text: HTMLとは何か
  - kind: paragraph
    text: HTML（HyperText Markup Language）は、Webページの**構造（骨組み）**を記述する言語です。「ここは見出し」「ここは段落」「ここはリスト」と、内容に意味を与えていきます。色や配置などの見た目は次章のCSSが担当します。
  - kind: h3
    text: 要素とタグ
  - kind: paragraph
    text: HTMLは「要素」の積み重ねでできています。要素は開始タグと終了タグで内容を挟んで書きます。
  - kind: code
    text: |
      <h1>今日の献立</h1>
      <p>今日はカレーを作ります。</p>
      <ul>
        <li>じゃがいも</li>
        <li>にんじん</li>
        <li>玉ねぎ</li>
      </ul>
      <a href="https://example.com">レシピを見る</a>
  - kind: h3
    text: まず覚えるタグ
  - kind: ul
    items:
      - "**h1〜h6** … 見出し（h1が最上位）"
      - "**p** … 段落"
      - "**ul / ol / li** … リスト（黒丸 / 番号つき）"
      - "**a** … リンク（href属性で行き先を指定）"
      - "**img** … 画像（src属性でファイルを指定）"
      - "**div / span** … 意味を持たないグループ化の入れ物"
  - kind: tip-box
    title: "💡 コツ:"
    text: ブラウザで右クリック →「検証」（開発者ツール）を開くと、どんなページもHTMLの構造を見られます。好きなサイトの骨組みを覗いてみるのが一番の教材です。
  - kind: h3
    text: なぜ「構造」と「見た目」を分けるのか
  - kind: paragraph
    text: HTMLには文字を大きくしたり色を付けたりするタグも一応あります。ですが今はほとんど使いません。**構造と見た目を混ぜると、後から変更するのが地獄になる**からです。
  - kind: paragraph
    text: たとえば「見出しの色を全部変えたい」とき、構造と見た目が分かれていればCSSの1行を直すだけで済みます。混ざっていると、全ページの全見出しを手で直すことになります。この分離の恩恵は次章で実感できます。
  - kind: assignment
    title: プロフィールカード（第1段階）
    goal: 自分のプロフィールカードをHTMLだけで作ります。この課題は第2章・第3章で育てていくので、消さずに取っておいてください。
    steps:
      - "`profile.html` というファイルを作る"
      - 名前を h1、肩書き（学習中のことなど）を p で書く
      - 「できること」を ul のリストで3つ以上書く
      - 好きなサイトへのリンクを a で貼る
      - ブラウザで開いて表示を確認する
    done:
      - ブラウザで開くと内容が表示される
      - 開発者ツールで見たとき、意図した入れ子になっている
      - なぜその要素を選んだか説明できる（なぜ div ではなく h1 か）
    hint: 見た目が地味でも気にしないこと。今は「構造が正しいか」だけを見ます。飾りつけは次章の仕事です。
  - kind: checklist
    items:
      - HTMLの役割は「構造」だと説明できる
      - 開始タグ・終了タグ・属性の書き方が分かる
      - 開発者ツールで他のページの構造を見たことがある
      - profile.html を作ってブラウザで表示できた
