id: 1
level: web
type: frontend
icon: "🏗️"
title: HTML
subtitle: ページの骨組みを作る
source_refs:
  - input/raw/web-dev/mentoring-notes.md
# 講師向け（teacher.html のカンペに出る。受講者用ページには出ない）
teaching:
  sessions: 3
  goal: タグで構造を書く感覚をつかませる。見た目の話はまだしない。「なぜこのタグか」を毎回言わせる。
  watch: 見た目を整えたがるので「それは次章」と切る。閉じタグ忘れ・入れ子の崩れは開発者ツールで自分に気付かせる。div だらけになったら「これは何を表す箱？」と聞く。
  ask: なぜここは div ではなく h1 にした？このページ、CSSを全部外したら意味が通じる？
keywords:
  - term: HTML
    desc: Webページの構造（骨組み）を記述する言語
  - term: タグ
    desc: 要素の始まりと終わりを示す目印。<p>〜</p> のように書く
  - term: 要素
    desc: タグで挟まれたページの構成単位。見出し・段落など
  - term: 属性
    desc: 要素に追加する情報。href や src、id、class など
  - term: 入れ子（ネスト）
    desc: 要素の中に要素を入れること。順番通りに閉じる必要がある
  - term: セマンティック
    desc: 見た目でなく意味でタグを選ぶ考え方
  - term: 開発者ツール
    desc: ブラウザ内蔵の解析ツール。右クリック→検証で開く
content_blocks:
  - kind: kv-box
    title: "🎯 この章のゴール:"
    text: HTMLが「見た目」ではなく「構造」を書く言語だと理解し、意味に合ったタグを選んでページの骨組みを作れるようになる。最終的にオセロの盤面もHTMLで組みます。
  - kind: h3
    text: はじめに — 道具をそろえる
  - kind: paragraph
    text: 本題に入る前に、開発に使う道具を用意します。**ここは一度やれば以降ずっと使うもの**なので、面倒でも最初にきちんと整えてください。必要なのは「エディタ」と「ブラウザ」の2つだけです。
  - kind: h3
    text: ① VS Code を入れる
  - kind: paragraph
    text: コードを書くための専用エディタです。メモ帳でも書けますが、色分け・入力補完・エラー表示があるかどうかで学習効率がまるで変わります。**現場で最も使われているエディタ**でもあります。
  - kind: ol
    items:
      - "`Visual Studio Code` で検索し、公式サイトからダウンロードする（無料）"
      - インストーラを実行する。選択肢はすべて既定のままでよい
      - 起動して、真っ黒な画面が出れば成功
  - kind: paragraph
    text: 起動したら、**拡張機能**を入れます。左側の四角が4つ並んだアイコン（Extensions）をクリックし、名前で検索してインストールしてください。
  - kind: table
    headers:
      - 拡張機能
      - 何ができるか
      - 必須度
    rows:
      - - Japanese Language Pack
        - VS Code のメニューが日本語になる
        - 好みで
      - - Live Server
        - "**保存すると自動でブラウザが更新される**"
        - ほぼ必須
      - - HTML CSS Support
        - HTMLの中でCSSクラス名を補完してくれる
        - あると楽
  - kind: kv-box
    title: "📌 Live Server がいちばん効く:"
    text: これを入れると、HTMLファイルを右クリック →「Open with Live Server」で開けます。**以降はファイルを保存するだけでブラウザが自動更新される**ので、「保存 → ブラウザに切り替え → 再読み込み」の繰り返しが不要になります。地味ですが学習速度がかなり変わります。
  - kind: h3
    text: ② 作業フォルダを作る
  - kind: paragraph
    text: 作ったファイルが散らからないよう、専用のフォルダを決めます。**日本語やスペースを含まない場所**にするのが無難です（後々ツールが誤動作する原因になります）。
  - kind: code
    text: |
      C:\dev\web-study\          ← ここを作業フォルダにする
        ├─ profile.html          ← 第1章で作る
        ├─ style.css             ← 第2章で追加
        └─ script.js             ← 第3章で追加
  - kind: paragraph
    text: フォルダを作ったら、VS Code の「ファイル → フォルダーを開く」でそのフォルダを開いてください。左側にファイル一覧が出れば準備完了です。
  - kind: warn-box
    title: "⚠️ 拡張子を表示させておく:"
    text: |
      Windowsは初期設定で拡張子（.html などの末尾）を隠します。この状態で作業すると
      **「profile.html」のつもりが「profile.html.txt」になっていて開けない**という事故が起きます。

      エクスプローラーの「表示」タブ →「ファイル名拡張子」にチェックを入れて、必ず表示させてください。
  - kind: h3
    text: ③ ブラウザと開発者ツール
  - kind: paragraph
    text: ブラウザは **Chrome か Edge** を使ってください。どちらも同じ仕組みで動いており、開発者向けの機能が充実しています。
  - kind: paragraph
    text: 準備できたら、いま見ているこのページで **F12キー** を押してみてください。画面が分割されて、コードのようなものが出れば成功です。これが**開発者ツール**で、この先ずっと使います（詳しい使い方はこの章の後半で説明します）。
  - kind: tip-box
    title: "💡 これで準備完了:"
    text: 道具はこれだけです。**Web開発は最初の一歩の敷居が低い**のが良いところで、エディタとブラウザさえあれば始められます。Gitやサーバは必要になったときに入れます（第4章・第5章）。
  - kind: h3
    text: そもそもWebページとは何でできているか
  - kind: paragraph
    text: 普段見ているWebページは、実は**ただのテキストファイル**です。ブラウザがそのテキストを読んで、解釈して、画面に描いています。魔法は何もありません。
  - kind: paragraph
    text: そのテキストは3種類の役割に分かれています。この分担がWeb開発の土台なので、最初に頭に入れてください。
  - kind: table
    headers:
      - 言語
      - 役割
      - 例えるなら
    rows:
      - - HTML
        - 構造（何がどこにあるか）
        - 家の骨組み・間取り
      - - CSS
        - 見た目（どう見えるか）
        - 内装・壁紙・家具の配置
      - - JavaScript
        - 動き（何が起きるか）
        - 電気・水道などの設備
  - kind: paragraph
    text: この章で扱うのはHTMLだけです。**見た目が地味でも気にしないでください**。骨組みが正しくできていれば、あとから内装はいくらでも変えられます。
  - kind: h3
    text: 最小のHTMLファイル
  - kind: paragraph
    text: まずは動くものを見ます。テキストエディタで次を書いて `index.html` という名前で保存し、ダブルクリックしてブラウザで開いてください。
  - kind: code
    text: |
      <!DOCTYPE html>
      <html lang="ja">
        <head>
          <meta charset="UTF-8">
          <title>はじめてのページ</title>
        </head>
        <body>
          <h1>こんにちは</h1>
          <p>これが最初のWebページです。</p>
        </body>
      </html>
  - kind: paragraph
    text: 表示されましたか。これで**もうWebページを作ったことになります**。順に何を書いたか見ていきます。
  - kind: ul
    items:
      - "**`<!DOCTYPE html>`** … 「これはHTMLです」という宣言。おまじないと思ってよい。必ず1行目に書く"
      - "**`<html lang=\"ja\">`** … 全体を包む要素。lang=\"ja\" は日本語のページだという情報"
      - "**`<head>`** … ページの設定を書く場所。**画面には表示されない**"
      - "**`<meta charset=\"UTF-8\">`** … 文字コードの指定。これが無いと日本語が文字化けする"
      - "**`<title>`** … ブラウザのタブに出る名前"
      - "**`<body>`** … 実際に画面に表示される中身。ここが本体"
  - kind: warn-box
    title: "⚠️ 文字化けしたら:"
    text: 日本語が「譁�蟄怜喧縺�」のように壊れて見えたら、ほぼ `<meta charset="UTF-8">` の書き忘れです。ファイル自体の保存形式がUTF-8になっているかも確認してください（VS Codeなら右下に表示されます）。
  - kind: h3
    text: 要素とタグ — HTMLの基本単位
  - kind: paragraph
    text: HTMLは**要素**の積み重ねでできています。要素は「開始タグ」「中身」「終了タグ」の3つで1組です。
  - kind: code
    text: |
      <p>これが段落です。</p>
      ↑            ↑        ↑
      開始タグ     中身     終了タグ（/ が付く）
  - kind: paragraph
    text: 終了タグを忘れると、そこから後ろが全部おかしくなります。慣れるまでは**開始タグを書いたらすぐ終了タグも書いて、後から中身を埋める**やり方が安全です。
  - kind: h3
    text: 入れ子（ネスト）— 箱の中に箱を入れる
  - kind: paragraph
    text: 要素の中に別の要素を入れられます。これを入れ子と呼びます。HTMLの構造はすべてこの入れ子でできています。
  - kind: code
    text: |
      <ul>
        <li>じゃがいも</li>
        <li>にんじん</li>
        <li>玉ねぎ</li>
      </ul>
  - kind: warn-box
    title: "⚠️ 閉じる順番は「後に開けたものを先に閉じる」:"
    text: |
      箱を入れ子にするのと同じで、順番を守らないと壊れます。

      ⭕ 正しい: <p>これは<strong>大事</strong>です</p>
      ❌ 誤り:   <p>これは<strong>大事</p></strong>
  - kind: tip-box
    title: "💡 インデントを付ける:"
    text: 入れ子になったら、中の要素は半角スペース2つ分ずらして書きます。**ブラウザの動作には影響しませんが、人間が読むときに構造が一目で分かります**。これは実務でも必ず守られている習慣です。
  - kind: h3
    text: 属性 — 要素に情報を足す
  - kind: paragraph
    text: タグには**属性**という追加情報を書けます。「開始タグの中に、名前=\"値\" の形で書く」と覚えてください。
  - kind: code
    text: |
      <a href="https://example.com">リンクの文字</a>
         ↑    ↑
         属性名 値（ダブルクォートで囲む）

      <img src="cat.jpg" alt="猫の写真">
      <div id="board" class="game-area">…</div>
  - kind: table
    headers:
      - 属性
      - 使うタグ
      - 意味
    rows:
      - - href
        - a
        - リンク先のURL
      - - src
        - img
        - 画像ファイルの場所
      - - alt
        - img
        - 画像が表示できないときの代替文。読み上げにも使われる
      - - id
        - どの要素にも
        - その要素だけの名前。**ページ内で重複させない**
      - - class
        - どの要素にも
        - グループ名。同じclassを複数の要素に付けてよい
  - kind: kv-box
    title: "📌 id と class は後で効いてくる:"
    text: いまは「名前を付けるもの」という理解で十分です。ただし**次章のCSSと第3章のJavaScriptで多用します**。CSSは「この名前の要素をこう見せる」、JavaScriptは「この名前の要素を操作する」ために使います。ここで名前を付ける習慣をつけておくと後が楽です。
  - kind: h3
    text: まず覚えるタグ
  - kind: paragraph
    text: HTMLのタグは100種類以上ありますが、実際によく使うのは20個程度です。まずは次のものから覚えてください。
  - kind: table
    headers:
      - タグ
      - 意味
      - 補足
    rows:
      - - h1〜h6
        - 見出し
        - h1が最上位。**1ページにh1は1つが基本**
      - - p
        - 段落
        - 文章のかたまり
      - - ul / li
        - 順序なしリスト
        - 黒丸のリスト。liはulの中にだけ書く
      - - ol / li
        - 順序つきリスト
        - 番号が振られる
      - - a
        - リンク
        - href属性で行き先を指定
      - - img
        - 画像
        - 終了タグが無い（中身を持たないため）
      - - table
        - 表
        - オセロの盤面にも使える
      - - button
        - ボタン
        - 押せる要素。JSと組み合わせる
      - - input
        - 入力欄
        - 終了タグが無い
      - - div
        - 意味を持たない箱
        - グループ化のための入れ物
      - - span
        - 意味を持たない箱（文中用）
        - 文章の一部を囲むとき
  - kind: h3
    text: div と span の違い
  - kind: paragraph
    text: 初心者がよく混乱する2つです。役割は同じ「意味を持たない箱」ですが、**表示のされ方**が違います。
  - kind: ul
    items:
      - "**div** … 前後で改行される（縦に積まれる）。**ブロック要素**と呼ぶ"
      - "**span** … 改行されず、文章の中に収まる。**インライン要素**と呼ぶ"
  - kind: code
    text: |
      <div>これは箱1</div>
      <div>これは箱2</div>
      <!-- → 縦に2段で表示される -->

      <p>この文の<span>ここだけ</span>を囲む</p>
      <!-- → 1行のまま。spanは流れを乱さない -->
  - kind: h3
    text: 「見た目」でタグを選んではいけない
  - kind: paragraph
    text: ここがこの章でいちばん大事な話です。**「文字を大きくしたいからh1を使う」という選び方をしないでください**。h1は「このページの主題」を表すタグであって、文字を大きくするタグではありません。
  - kind: code
    text: |
      ❌ 悪い例（見た目で選んでいる）
      <h1>会社概要</h1>
      <h1>お問い合わせ</h1>     ← 大きくしたいから h1 にした

      ⭕ 良い例（意味で選んでいる）
      <h1>株式会社サンプル</h1>  ← ページの主題は1つ
      <h2>会社概要</h2>
      <h2>お問い合わせ</h2>
  - kind: paragraph
    text: 意味に合ったタグを選ぶことを**セマンティック**なHTMLと言います。なぜ大事かというと、HTMLを読むのは人間の目だけではないからです。
  - kind: ul
    items:
      - "**検索エンジン** … h1やタグ構造を見てページの内容を理解する。検索結果での見え方が変わる"
      - "**スクリーンリーダー** … 目の不自由な人が使う読み上げソフト。「見出しだけ拾って移動」ができるのは h1〜h6 が正しく付いているページだけ"
      - "**あとで直す人** … 下の例を見てください"
  - kind: paragraph
    text: 3つ目が分かりにくいので、具体例を出します。次の2つは**画面上はまったく同じに見えます**。半年後にこのコードを開いて、どこを直せばいいか分かるのはどちらでしょうか。
  - kind: code
    text: |
      ❌ 全部 div で書いた場合
      <div class="t1">料金プラン</div>
      <div class="b1">
        <div class="t2">無料プラン</div>
        <div class="x">月0円</div>
      </div>

      ⭕ 意味のあるタグで書いた場合
      <h2>料金プラン</h2>
      <section>
        <h3>無料プラン</h3>
        <p>月0円</p>
      </section>
  - kind: paragraph
    text: 上は `t1` `b1` `x` が何なのか、**CSSを開いて照らし合わせないと分かりません**。下は読むだけで「料金プランの見出しがあって、その下に無料プランの説明がある」と分かります。半年後の自分は他人です。そのとき助かるのは下の書き方です。
  - kind: tip-box
    title: "💡 判断に迷ったときの問い:"
    text: 「**CSSを全部外したとき、この文書は読めるか**」を考えてみてください。見出し・段落・リストが適切なら、装飾ゼロでも意味が通ります。通らないなら、タグの選び方を見直す合図です。
  - kind: h3
    text: なぜ「構造」と「見た目」を分けるのか
  - kind: paragraph
    text: 実はHTMLにも文字を大きくしたり色を変えたりするタグ（`<font>` など）が存在します。ですが**もう使われません**。構造と見た目を混ぜると、後から変更するのが地獄になるからです。
  - kind: paragraph
    text: 例えば100ページのサイトで「見出しの色を変えたい」となったとき——構造と見た目が分かれていればCSSの1行を直すだけで全ページに反映されます。混ざっていると、100ページ分の全見出しを手作業で直すことになります。この差は決定的です。
  - kind: h3
    text: 開発者ツールを開いてみる
  - kind: paragraph
    text: ブラウザには、表示中のページのHTMLを見る機能が標準で付いています。**世の中の全Webページが教材になる**ので、必ず使えるようになってください。
  - kind: ol
    items:
      - 好きなWebページを開く
      - 気になる部分を右クリック →「検証」（または F12）
      - 画面が分割され、そのページのHTMLが表示される
      - HTMLの行にマウスを乗せると、画面上の対応する場所が光る
  - kind: tip-box
    title: "💡 使い方のコツ:"
    text: 「このボタン、どう作られているんだろう」と思ったら右クリック→検証。**プロが書いたHTMLをいくらでも読めます**。最初は複雑で面食らいますが、知っているタグを探すだけでも勉強になります。
  - kind: h3
    text: よくあるエラーと直し方
  - kind: table
    headers:
      - 症状
      - 原因
      - 直し方
    rows:
      - - 日本語が文字化けする
        - charset の指定漏れ
        - "`<meta charset=\"UTF-8\">` を head に入れる"
      - - 途中から表示が崩れる
        - 終了タグの書き忘れ
        - 開発者ツールで入れ子を確認する
      - - リンクが飛ばない
        - href のスペルミス・クォート忘れ
        - "`href=\"...\"` の形になっているか"
      - - 画像が出ない
        - ファイルの場所が違う
        - HTMLファイルから見た相対パスを確認
      - - 変更が反映されない
        - 保存していない / キャッシュ
        - 保存して Ctrl+Shift+R で再読み込み
  - kind: warn-box
    title: "⚠️ HTMLはエラーで止まらない:"
    text: プログラミング言語と違い、HTMLは間違っていても**エラーを出さずに勝手に解釈して表示します**。「なんか崩れてる」だけで原因を教えてくれません。だからこそ開発者ツールで構造を確認する習慣が重要になります。
  - kind: assignment
    title: プロフィールカード（第1段階）
    goal: 自分のプロフィールカードをHTMLだけで作ります。この課題は第2章・第3章で育てていくので、消さずに取っておいてください。見た目は次章で整えるので、**いまは構造だけに集中**します。
    steps:
      - "`profile.html` を作り、DOCTYPE から body までの骨組みを書く"
      - タブに表示される title を自分の名前にする
      - 名前を h1、肩書き（学習中のことなど）を p で書く
      - 「できること」を ul のリストで3つ以上書く
      - 好きなサイトへのリンクを a で貼る（新しいタブで開く方法も調べてみる）
      - 自己紹介文を p で2〜3段落書く
      - 各パーツを div で囲み、id か class で名前を付けておく（次章で使う）
      - ブラウザで開いて表示を確認し、開発者ツールで構造を見る
    done:
      - ブラウザで開くと内容が表示される
      - 開発者ツールで見たとき、意図した入れ子になっている
      - なぜその要素を選んだか説明できる（なぜ div ではなく h1 か）
      - 文字化けしていない
      - h1 が1つだけになっている
    hint: 見た目が地味でも気にしないこと。今は「構造が正しいか」だけを見ます。飾りつけは次章の仕事です。リンクを新しいタブで開く方法は、`a` タグの属性を調べてみてください。
  - kind: ex-box
    title: 発展課題（余裕があれば）
    text: 第4章で作るオセロの**盤面だけ**をHTMLで書いてみましょう。8×8のマス目です。table タグを使う方法と、div を並べる方法の2通りが考えられます。どちらが良さそうか考えながら書いてみてください（正解はありません。第2章で見た目を付けるときに違いが分かります）。
  - kind: tip-box
    title: "💡 次章への橋渡し:"
    text: 骨組みができました。ただ、いまは真っ白で味気ないはずです。次章のCSSで**同じHTMLのまま見た目だけを変えられる**ことを体験します。HTMLを書き直す必要はありません——それが構造と見た目を分ける利点です。
  - kind: checklist
    items:
      - HTMLの役割は「構造」だと説明できる
      - 開始タグ・終了タグ・属性の書き方が分かる
      - 入れ子を正しい順番で閉じられる
      - div と span の違いを説明できる
      - 見た目ではなく意味でタグを選べる
      - 開発者ツールで他のページの構造を見たことがある
      - profile.html を作ってブラウザで表示できた
