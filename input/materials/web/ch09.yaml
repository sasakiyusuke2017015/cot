id: 9
level: web
type: release
icon: "🚀"
title: デプロイ
subtitle: 世界に公開する
source_refs:
  - input/raw/web-dev/mentoring-notes.md
teaching:
  sessions: 3
  goal: 公開URLを人に渡すところまで。「動くものを世界に出した」経験が次の燃料になる。
  watch: 公開前に環境変数・秘密情報のチェックを一緒にやる。ここは講師が必ず確認する。
  ask: このリポジトリ、いま公開して困るものは入ってない？
keywords:
  - term: デプロイ
    desc: アプリを公開して誰でも使える状態にすること
  - term: ホスティング
    desc: アプリを動かすサーバーを貸してくれるサービス
  - term: localhost
    desc: 自分のPCを指すアドレス。他の人からは見えない
  - term: 静的サイト
    desc: HTML/CSS/JSだけで動く、サーバ処理の要らないサイト
  - term: Vercel / Netlify
    desc: GitHub連携でフロントを自動公開する定番サービス
  - term: 環境変数
    desc: APIキーなど秘密の設定をコード外に置く仕組み
  - term: ビルド
    desc: 公開用にコードをまとめ直す処理
  - term: 自動デプロイ
    desc: pushのたびに最新版が自動で公開される仕組み
  - term: ログ
    desc: サーバ側で何が起きたかの記録。本番の不具合はここから追う
content_blocks:
  - kind: kv-box
    title: "🎯 この章のゴール:"
    text: 自分の作ったWebアプリをインターネットに公開し、**公開URLを人に送って遊んでもらう**ところまでを体験する。ここまでの全部の総仕上げです。
  - kind: h3
    text: デプロイとは何か
  - kind: paragraph
    text: デプロイとは、手元で動いているアプリを**インターネット上のサーバーに配置して、誰でも使える状態にする**ことです。
  - kind: code
    text: |
      コードを書く
         ↓
      GitHubへ push
         ↓
      ホスティングサービスが自動でビルド・公開
         ↓
      https://あなたのアプリ.vercel.app  ← 世界中からアクセスできる
  - kind: h3
    text: なぜ localhost では駄目なのか
  - kind: paragraph
    text: 前章までのオセロは `http://127.0.0.1:8000` で動いていました。この住所は「**自分のPC**」を指しています。同じURLを友達に送っても、相手のPCの中を見に行くだけで、あなたのアプリには繋がりません。
  - kind: table
    headers:
      - ""
      - localhost
      - デプロイ後
    rows:
      - - 見られる人
        - 自分だけ
        - 世界中の誰でも
      - - 動いている時間
        - 自分がPCを起動している間だけ
        - 24時間ずっと
      - - URL
        - 127.0.0.1:8000
        - "https://…（本物のドメイン）"
      - - 止まるとき
        - ターミナルを閉じたら
        - 自分で止めるまで
  - kind: kv-box
    title: "📌 「誰かのPCで動き続けている」だけ:"
    text: デプロイと聞くと特別なことに思えますが、やっていることは**「自分のPCの代わりに、24時間動いているどこかのコンピュータでプログラムを動かす」**だけです。ホスティングサービスは、そのコンピュータを貸してくれる会社です。仕組みが分かれば怖くありません。
  - kind: h3
    text: 2種類のデプロイがある
  - kind: paragraph
    text: 自分のアプリがどちらなのかで、選ぶサービスが変わります。オセロは**両方**を含んでいます。
  - kind: table
    headers:
      - 種類
      - 中身
      - 必要なもの
    rows:
      - - 静的サイト
        - HTML / CSS / JS だけ
        - ファイルを置く場所だけあればよい
      - - サーバが要るアプリ
        - Python が動き続ける + DB
        - プログラムを実行し続けられる環境
  - kind: paragraph
    text: つまりオセロの公開は**2つの場所へのデプロイ**になります。画面（フロント）を1か所、API + DB（バック）をもう1か所。そして両者をURLで繋ぎ直します。ここが唯一ややこしい部分です。
  - kind: h3
    text: 今どきのデプロイはGit連携
  - kind: paragraph
    text: VercelやNetlify、Render などのホスティングサービスは、**GitHubのリポジトリを連携するだけ**で、pushのたびに自動で最新版を公開してくれます。第4章で身につけたGitの習慣がここで直接活きます。
  - kind: ul
    items:
      - フロントエンド（HTML/CSS/JS）… Vercel / Netlify / GitHub Pages などが定番
      - API + DB … Render / Railway など、DBも一緒に提供するサービスが手軽
  - kind: paragraph
    text: 基本の流れは、どのサービスでもほぼ同じです。
  - kind: ol
    items:
      - サービスにGitHubアカウントでログインする
      - "「New Project」などから、公開したいリポジトリを選ぶ"
      - ビルド設定と公開するフォルダを指定する（静的サイトなら大抵そのままでよい）
      - 環境変数を設定する（次の節）
      - Deploy を押す。数分待つとURLが発行される
  - kind: tip-box
    title: "💡 pushしたら自動で反映される:"
    text: 一度つなげば、あとは `git push` するだけで公開版が更新されます。**手作業でファイルをアップロードする必要はありません**。「pushしたら数分後に本番が変わる」という感覚を、ここで一度味わっておいてください。
  - kind: h3
    text: 環境変数 — 秘密をコードの外に置く
  - kind: paragraph
    text: 第8章で `.env` に接続情報を書きました。このファイルは `.gitignore` に入れているので、**GitHubには上がっていません**。ということは、公開先のサーバにも届いていません。
  - kind: paragraph
    text: そこで、**ホスティングサービスの管理画面から環境変数を設定します**。多くのサービスに「Environment Variables」という項目があります。
  - kind: code
    text: |
      手元（.env ファイル）        公開先（サービスの管理画面）
        DB_PATH=othello.db    →    DB_PATH=/data/othello.db
        API_URL=127.0.0.1:8000 →   API_URL=https://xxx.onrender.com

      コードは同じまま。値だけが場所によって変わる
  - kind: kv-box
    title: "📌 これが第8章で環境変数にした理由:"
    text: もし接続情報をコードに直接書いていたら、公開のたびにコードを書き換えることになります。**「環境ごとに変わるものは、コードの外に出す」**——この原則が、ここで具体的な形で効いてきます。
  - kind: h3
    text: 公開前チェック
  - kind: warn-box
    title: "⚠️ 公開は取り消せないと思うこと:"
    text: 一度インターネットに出したものは、消しても誰かの手元に残っている可能性があります。**特にリポジトリを公開（public）にする場合は、履歴のすべてが見られます**。第4章で学んだとおり、過去のcommitに秘密情報が残っていれば、それも見えます。押す前に必ず確認してください。
  - kind: checklist
    title: 公開前に確認すること
    items:
      - APIキー・パスワードがコードに書かれていない
      - .env が .gitignore に入っていて、commitされていない
      - 過去のcommit履歴にも秘密情報が残っていない
      - CORSの許可を「なんでも許可」のままにしていない
      - 個人情報・実在の住所や電話番号を含むテストデータが入っていない
      - DELETE系のAPIに、誰でも叩ける状態で危険なものが無い
      - リポジトリを public にしてよいか2人で確認した
  - kind: h3
    text: 「手元では動くのに本番で動かない」
  - kind: paragraph
    text: デプロイして最初にほぼ必ず起きます。**バグではなく、環境の違いです**。原因はだいたいこの5つに絞られます。
  - kind: table
    headers:
      - 症状
      - 原因
      - 対処
    rows:
      - - 画面は出るがデータが来ない
        - APIのURLが127.0.0.1のまま
        - 公開したAPIのURLに書き換える
      - - CORSエラー
        - 許可するオリジンが手元のまま
        - 公開したフロントのURLを許可に追加
      - - 起動に失敗する
        - ライブラリが入っていない
        - requirements.txt を用意したか確認
      - - 500 が返る
        - 環境変数が未設定
        - 管理画面で設定して再デプロイ
      - - しばらくするとデータが消える
        - 保存先が一時的な場所
        - 永続化されるDBを使う（下記）
  - kind: warn-box
    title: "⚠️ SQLiteファイルが消えることがある:"
    text: サービスによっては、**再起動のたびにファイルが初期状態に戻ります**（アプリを動かす場所と、データを残す場所が別になっているため）。手元では消えないのに本番だけ消える、という現象の正体はこれです。対処は、そのサービスが提供する永続ディスクを使うか、**PostgreSQLなどの独立したDBサービスに移す**ことです。第6章で「SQLは製品が変わってもほぼ同じ」と書いたのは、ここで効いてきます。
  - kind: h3
    text: ログを読む
  - kind: paragraph
    text: 本番では `print` の出力が画面に見えません。代わりに、**サービスの管理画面に「Logs」という項目**があります。第7章でターミナルのエラーを読んだのと同じことを、ここで行います。
  - kind: ol
    items:
      - 管理画面の Logs（またはDeploy Logs）を開く
      - デプロイ時のエラーか、実行時のエラーかを見分ける
      - Pythonのエラーが出ていれば、手元と同じように読む
      - 直したら push する。自動で再デプロイされる
  - kind: tip-box
    title: "💡 切り分けは今までと同じ:"
    text: 本番だからといって特別なことはありません。**Networkタブでリクエストを見て、ログでサーバ側を見る**。第7章で身につけた切り分けが、そのまま通用します。「本番だから分からない」と思った瞬間に手が止まるので、いつもの手順に落として考えてください。
  - kind: h3
    text: 公開したら、人に使ってもらう
  - kind: paragraph
    text: URLができたら、**必ず誰かに送って使ってもらってください**。ここまでが課題です。家族でも友人でも構いません。
  - kind: paragraph
    text: 自分以外の人が触ると、想定していなかったことが必ず起きます。「スマホだと盤面がはみ出る」「連打すると変になる」「何をすればいいか分からない」——これらは**自分では絶対に見つけられない種類の問題**です。実際に使われて初めて分かることがある、というのを体験してください。
  - kind: assignment
    title: オセロを世界に公開する
    goal: 2人で作ったオセロを、誰でも遊べる場所に置きます。**公開URLを人に送って遊んでもらう**ところまでが課題です。ここまでの全部の集大成になります。
    steps:
      - 公開前チェックを2人で一緒に行う
      - フロントエンド（オセロの画面）をVercelかNetlifyにデプロイする
      - API + DB を Render か Railway にデプロイする
      - 環境変数をサービスの管理画面に設定する
      - フロント側のAPI接続先を、ローカルのURLから公開URLに書き換える
      - CORSの許可設定を、公開したフロントのURLに変更する
      - 公開URLで実際に対戦し、戦績が保存されることを確認する
      - 一度 push して、自動で反映されることを確認する
      - 家族や友人にURLを送って遊んでもらう
      - もらった感想をIssueに登録する
    done:
      - 公開URLにアクセスして対戦できる
      - 対戦結果が保存され、再訪しても残っている
      - スマホからも開いて動作を確認した
      - 自分以外の誰かに遊んでもらった
      - APIキーやパスワードがコードに残っていないか確認した
      - 本番のログを開いて、中身を読んだことがある
    hint: フロントとAPIは別々のサービスにデプロイすることになります。「フロントは動くがAPIに繋がらない」ときは、接続先URLとCORS設定の2つを疑ってください。第7章で学んだ切り分けがそのまま使えます。一度にすべてを繋ごうとせず、まずフロントだけ公開して表示を確認する、と段階を分けると原因が絞れます。
  - kind: ex-box
    title: 発展課題（余裕があれば）
    text: 独自ドメイン（`othello-tanaka.com` のような自分専用のURL）を取って割り当ててみましょう。年間千円台から取得できます。あわせて、**pushしたら自動でテストを走らせてから公開する**仕組み（GitHub Actions など）も調べてみてください。「壊れたコードが本番に出ない」ようにする、実務では当たり前の仕組みです。
  - kind: h3
    text: ここまで来たら
  - kind: paragraph
    text: 必修範囲はここで終わりです。振り返ると、**HTMLでページを書き、CSSで整え、JavaScriptで動かし、Gitで2人で共同開発し、Pythonでサーバを書き、SQLでデータを設計し、APIで繋ぎ、DBに保存し、世界に公開した**——Webアプリを一通り自分の手で作ったことになります。
  - kind: kv-box
    title: "📌 覚えたのは文法ではない:"
    text: この過程で本当に身についたのは、タグやコマンドではなく、**エラーを読む・原因を仮説立てる・調べる・直す**というサイクルです。これは言語やフレームワークが変わっても使えます。次に何を学ぶときも、同じやり方で進められます。
  - kind: paragraph
    text: この先は発展範囲です。第10章で**TypeScript**、第11章で**React**を扱います。どちらも「動いているオセロを作り直す」課題なので、**すでに動くものがある状態で新しい道具の効果を確かめられます**。順番はどちらからでも構いません。
  - kind: checklist
    items:
      - デプロイの意味を説明できる
      - localhost と公開URLの違いを説明できる
      - 静的サイトとサーバが要るアプリの違いが分かる
      - push → 自動公開の流れを体験した
      - 環境変数をサービス側に設定できる
      - 公開前に秘密情報のチェックができる
      - 本番のログを見て原因を追える
      - 公開URLを人に共有して使ってもらった
