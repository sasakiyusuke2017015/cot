# Web開発の虎の巻 — コース全体の設計（講師用ハブページ index.html の元データ）
#
# 章の一覧は chNN.yaml から自動で集約されるのでここには書かない。
# ここに書くのは「コース全体をどう運営するか」= 講師向けの設計情報。

title: Web開発の虎の巻
subtitle: リモート・2人・1日1時間で、Web開発を教えるためのガイド
lead: ゴールは文法を覚えさせることではなく、**自分で調べて・考えて・修正できるエンジニア**に育てること。基礎を終えたら2人で**対戦オセロ**を作り、戦績が保存され公開されるところまで進みます。
source_refs:
  - input/raw/web-dev/mentoring-notes.md

# ヘッダーに並ぶ前提条件のバッジ
conditions:
  - "👥 生徒2人"
  - "🏠 リモート"
  - "⏰ 1日1時間"
  - "📚 かじった程度からスタート"
  - "🎯 成果物: 2人で作る対戦オセロ"
  - "🗓 必修 約3か月 + 発展"

# 基本理念（エラー対応のサイクル）
principle:
  title: 基本理念
  text: 重要なのは「知識量」ではなく**「問題解決能力」**への移行。実務では検索・AI・ドキュメントを見ながら開発するため、文法暗記よりも次のサイクルを体で覚えることを最優先にする。
  cycle:
    - エラー文を読む
    - 原因の仮説を立てる
    - 調査する
    - 修正する

# 1コマ（1時間）の時間配分。minutes の合計が 60 になること
lesson_plan:
  title: 1日1時間の使い方
  slots:
    - minutes: 10
      label: 復習・質疑応答
      desc: 前回の内容を確認し、疑問を解消する。
      color: sky
    - minutes: 15
      label: 新しい内容の解説
      desc: 今日のテーマを短く伝える。講義は最小限。
      color: amber
    - minutes: 30
      label: 手を動かす演習
      desc: 時間の半分は必ず実践。ここが本体。
      color: emerald
    - minutes: 5
      label: 振り返りと宿題
      desc: できたことを確認し、次回までの課題を出す。
      color: violet
  warning: 1日1時間だと**3日止まるだけで流れが切れる**。小さな目標・できたことの確認・難しすぎない課題で継続を最優先に。

# 講師（メンター）の役割
mentor_roles:
  title: 教師（メンター）の役割
  lead: この条件での教師は「講師」ではなく**メンター兼コードレビュアー**。知識を教えるのではなく、学習を設計・継続させる。
  items:
    - label: 学習の道筋を作る
      badge: 最重要
      text: 何をどの順番で学ぶかを設計し、迷わず進めるロードマップを示す。
      color: amber
    - label: エラー解決の考え方を教える
      text: 答えを教えるのではなく「エラーを読む → 原因を予想 → どこを調べるか → 仮説を検証」を身につけさせる。
      color: red
    - label: コードレビュー
      text: 毎回レビューするだけで成長速度が変わる。見るのは **命名 / 可読性 / 重複 / 責務の分離 / バグになりそうな箇所**。
      color: sky
    - label: モチベーション管理
      text: 小さな目標を設定し、できたことを確認する。難しすぎる課題は出さない。
      color: emerald
    - label: 「なぜ？」を問いかける
      text: 「なぜこの書き方にした？」「他の方法は？」「もし100件データがあったら？」——考えさせる質問で理解を深める。
      color: violet
      wide: true
  not_needed:
    title: 教師がやらなくていいこと（書籍・動画・AIで代替できる）
    text: 文法を延々と講義する ／ スライドを読むだけ ／ 完成したコードを配る ／ すべて答えを教える

# 質問のルール
question_rule:
  title: 質問のルール「30分ルール」
  lead: 「分からなかったら聞いて」では質問する力が育たない。代わりにこう教える。
  quote: 30分調べて、「分かったこと」「試したこと」「仮説」を持って聞く。
  note: 質問が具体的になり、調べる力・整理する力が同時に育つ。

# 育成の3ステップ（章の進行とは別軸の、実務化までの流れ）
growth_steps:
  title: 育成の3ステップ
  items:
    - label: 基礎理解
      period: 1〜2週間
      goal: コードが読める状態にする
      bullets:
        - "開発環境構築: VS Code / Git / ターミナル操作"
        - "プログラミング基礎: 変数 / 条件分岐 / 繰り返し / 関数 / 配列 / クラス"
        - "デバッグ方法: エラー文を読む / ログを見る"
    - label: 小さい成果物を作る
      period: 2〜4週間
      goal: 開発感覚をつける
      groups:
        - label: 初級
          text: TODOアプリ / 電卓 / CSV集計ツール / 簡単なWeb API
          color: emerald
        - label: 中級
          text: ログイン機能 / DB CRUD / ファイルアップロード / 外部API連携
          color: sky
      note: 完成度より**「なぜこの設計にしたのか」を説明できること**を重視する。
    - label: 実務形式へ移行
      goal: チーム開発を経験する
      bullets:
        - "Git: branch / commit / pull request / merge"
        - "コードレビュー: 命名 / 重複 / 責務分離 / エラー処理 / セキュリティ"
      flow:
        - 仕様確認
        - 設計
        - 実装
        - テスト
        - レビュー
        - リリース

# やってはいけないこと
anti_patterns:
  title: やってはいけないこと
  items:
    - label: 最初から大きなシステム
      text: 新人は全体像が見えず混乱する。小さく作って積み上げる。
    - label: 「分からなかったら聞いて」
      text: 質問方法が育たない。→ **30分ルール**を教える。
    - label: 文法暗記中心
      text: 実務では検索・AI・ドキュメントを見る。知識量より問題解決能力。

# 伸びる人・伸びにくい人
learner_traits:
  title: 伸びる人・伸びにくい人
  good:
    label: 伸びる新人
    icon: "🌱"
    items:
      - エラーを怖がらない
      - 仮説を立てる
      - 調べた内容を整理できる
      - 質問が具体的
      - 他人のコードを読む努力をする
  bad:
    label: 伸びにくい新人
    icon: "🥀"
    items:
      - 答えを待つ
      - 動けばOKで済ませる
      - なぜ動くか説明できない

# 毎回まわすサイクル
teaching_cycle:
  title: 毎回まわすサイクル
  steps:
    - ゴールを明確にする
    - 学ぶ内容を整理する
    - 詰まったときの考え方を示す
    - レビューで改善点を伝える
    - 次回までの宿題を設定する
  note: このサイクルを回せれば、限られた時間でも着実に力が伸びる。
