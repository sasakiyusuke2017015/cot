id: 3
level: web
type: frontend
icon: "⚡"
title: JavaScript
subtitle: ページに動きをつける
source_refs:
  - input/raw/web-dev/mentoring-notes.md
teaching:
  sessions: 6
  goal: エラーとの付き合い方を覚える章。文法より「エラー文→仮説→調査→修正」を体験させる。
  watch: 詰まる人が一番多い。ここで30分ルールを本格的に運用開始する。答えを言わずコンソールを見せる。
  ask: console.log を入れるならどこ？なぜそこ？
keywords:
  - term: 変数
    desc: 値に名前を付けて保存する。const（再代入不可）と let
  - term: 条件分岐
    desc: if / else で条件に応じて処理を切り替える
  - term: 配列
    desc: 複数の値を順番に持つ入れ物。length で要素数
  - term: DOM操作
    desc: JavaScriptからHTML要素を取得・変更すること
  - term: console.log
    desc: 変数の中身をコンソールに表示するデバッグの基本
content_blocks:
  - kind: kv-box
    title: "🎯 この章のゴール:"
    text: 変数・条件分岐・繰り返し・関数・配列を使えるようになり、ボタンクリックでページが変わる体験をする。
  - kind: h3
    text: JavaScriptとは何か
  - kind: paragraph
    text: JavaScriptは、ページに**動き（ロジック）**を与えるプログラミング言語です。「ボタンを押したら表示を変える」「入力内容をチェックする」など、ユーザーの操作に反応する部分を担当します。
  - kind: h3
    text: 基本文法
  - kind: code
    text: |
      const name = '田中';            // 変数（再代入しないなら const）
      let count = 0;                  // 再代入するなら let

      if (count > 10) {               // 条件分岐
        console.log('多いですね');
      } else {
        console.log('まだ少ない');
      }

      const fruits = ['りんご', 'みかん', 'バナナ'];  // 配列
      for (const f of fruits) {       // 繰り返し
        console.log(f);
      }

      function greet(who) {           // 関数
        return 'こんにちは、' + who + 'さん';
      }
  - kind: h3
    text: DOM操作 — HTMLとつなぐ
  - kind: code
    text: |
      const btn = document.querySelector('#myButton');
      btn.addEventListener('click', () => {
        document.querySelector('#message').textContent = '押されました！';
      });
  - kind: warn-box
    title: "⚠️ ここが本番:"
    text: JavaScriptからは**必ずエラーに出会います**。エラーが出たら「エラー文を読む → 原因の仮説を立てる → 調べる → 修正する」。この流れを毎回意識してください。エラー文はコンソール（開発者ツールのConsoleタブ）に出ます。
  - kind: tip-box
    title: "💡 コツ:"
    text: 困ったらまず **console.log()** で変数の中身を表示して確認する癖をつけましょう。「思っていた値と違う」がバグの正体であることがほとんどです。
  - kind: h3
    text: JSファイルも分ける
  - kind: paragraph
    text: CSSと同じで、JavaScriptも別ファイルにします。`</body>` の直前で読み込むのが基本です。
  - kind: code
    text: |
      <!-- profile.html の </body> の直前 -->
      <script src="script.js"></script>
  - kind: kv-box
    title: "📌 3つの役割がそろった:"
    text: これで **HTML（構造）・CSS（見た目）・JavaScript（動き）** の3ファイル構成になります。この分け方はWeb開発の基本形で、どんな大きなサイトも根っこは同じです。「どのファイルを直せばいいか」が明確になるのが最大の利点です。
  - kind: assignment
    title: プロフィールカード（第3段階 — 動かす）
    goal: 第2章までのカードに動きをつけます。3つのファイルがそれぞれ何を担当しているかを、自分の言葉で説明できるようになるのが本当のゴールです。
    steps:
      - "`script.js` を作り、profile.html から読み込む"
      - 「詳細を見る」ボタンを置き、押すと隠れていた自己紹介文が表示されるようにする
      - もう一度押すと隠れる（トグル）ようにする
      - 「いいね」ボタンを作り、押すたびに数が増えるようにする
      - 押した回数が10を超えたら、メッセージを変える
    done:
      - ボタンを押すと表示が変わる
      - script.js を読み込まなくしても、ページ自体は壊れずに表示される
      - "HTML・CSS・JS がそれぞれ何をしているか説明できる"
    hint: 表示・非表示は CSS のクラスを付け外しする方法（classList.toggle）が定石です。JSから直接スタイルをいじるより、CSSに定義したクラスを切り替えるほうが後から変更しやすくなります。
  - kind: tip-box
    title: "💡 次章への橋渡し:"
    text: ここまでで **HTML・CSS・JavaScript がそろい、「動くWebページ」を自力で作れる状態**になりました。次章ではGitを覚えて、いよいよ2人でオセロを作ります。実はオセロは、ここまでの知識だけで作れます。
  - kind: checklist
    items:
      - const と let の使い分けが分かる
      - if / for / 関数 / 配列を組み合わせて書ける
      - エラーが出たらコンソールを読む習慣がある
      - HTML / CSS / JS の3ファイル構成でページを作れた
