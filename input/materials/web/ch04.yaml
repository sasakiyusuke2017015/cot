id: 4
level: web
type: vcs
icon: "🌿"
title: Git
subtitle: 履歴を残し、2人でオセロを作る
source_refs:
  - input/raw/web-dev/mentoring-notes.md
teaching:
  sessions: 20
  goal: Gitの5コマンド習得は前半のみ。本体は「2人でオセロを完成させる」共同開発の体験。機能分解→分担→進捗管理を回させる。
  watch: 機能分解を代わりにやらないこと。粗くても自分たちで割らせる。裏返し判定で必ず詰まるので、答えではなく「8方向をどう表現するか」だけ示す。コンフリクトは事故ではないと繰り返し伝える。
  ask: いま何が動いていて、次に何を作る？その機能は1日で終わる大きさ？
keywords:
  - term: リポジトリ
    desc: コードと履歴をまとめて管理する保管庫
  - term: commit
    desc: 変更を履歴として記録する操作
  - term: push / pull
    desc: 手元の履歴をGitHubへ送る / 最新を取り込む
  - term: GitHub
    desc: リポジトリをネット上に置いて共有するサービス
  - term: .gitignore
    desc: 履歴に含めないファイルを指定する設定
  - term: コンフリクト
    desc: 2人が同じ箇所を変更したとき起きる衝突。手で解決する
  - term: Issue
    desc: GitHubの課題管理。やることを1件ずつ登録して進捗を共有する
  - term: 機能分解
    desc: 大きな課題を、1日で終わる大きさの機能に割ること
content_blocks:
  - kind: kv-box
    title: "🎯 この章のゴール:"
    text: 5つの基本コマンドでコードをGitHubに置けるようになり、**2人で1つのリポジトリを共有してオセロを完成させる**。技術より「進め方」を身につけるのが本当の目的。
  - kind: h3
    text: なぜ今Gitを学ぶのか
  - kind: paragraph
    text: Gitはコードの**変更履歴を記録する**道具です。TypeScriptやReactより先に学ぶのは、実際の開発では**早い段階からGitを使う習慣**をつけたほうが自然だからです。ここから先の演習はすべてGitで履歴を残しながら進めます。
  - kind: h3
    text: まず覚える5コマンド
  - kind: code
    text: |
      git clone <URL>     # リモートのリポジトリを手元に複製する
      git add .           # 変更をステージに載せる（コミット対象にする）
      git commit -m "メッセージ"   # 変更を履歴として記録する
      git push            # 手元の履歴をGitHubに送る
      git pull            # GitHubの最新を手元に取り込む
  - kind: paragraph
    text: 日々の流れは「書く → add → commit → push」の繰り返しです。**この5つだけで十分**。branchやrebaseは後回しで構いません（チーム開発に入る段階で学びます）。
  - kind: tip-box
    title: "💡 コツ:"
    text: commitメッセージは「何をしたか」を短く書きます（例:「カウンター機能を追加」）。1日の終わりにまとめて1回ではなく、**キリのいい単位でこまめに**commitするのがおすすめです。
  - kind: warn-box
    title: "⚠️ 注意:"
    text: パスワードやAPIキーを書いたファイルをcommitしないこと。一度pushした履歴は簡単には消せません。秘密情報は .gitignore で除外します。
  - kind: ex-box
    title: 練習
    text: まず1人で慣れます。GitHubにリポジトリを作り、前章までのプロフィールカード（HTML・CSS・JSの3ファイル）をpushしてみましょう。3回以上commitを分けて、GitHub上で履歴が見えることを確認します。
  - kind: h3
    text: ここからが本番 — 2人で1つのものを作る
  - kind: paragraph
    text: ここまでは1人で作ってきました。ここからは**2人で1つのリポジトリを共有して**オセロを作ります。これがこのコース最大の山場であり、いちばん面白いところです。
  - kind: kv-box
    title: "📌 なぜオセロなのか:"
    text: オセロは**HTML・CSS・JavaScriptだけで完成させられます**。新しい技術を覚える必要がなく、ここまでの知識だけで「ちゃんと遊べるもの」が作れる。だから技術ではなく**進め方**に集中できます。
  - kind: h3
    text: いきなり書き始めない — まず機能に分解する
  - kind: paragraph
    text: 「オセロを作ろう」と言われても、どこから手をつけるか分かりません。実務でも同じで、**まず何が必要かを洗い出して、小さな単位に割る**ところから始めます。これを機能分解と呼びます。
  - kind: paragraph
    text: 2人で話し合って、オセロに必要な機能を挙げてください。以下は例です。**この表を鵜呑みにせず、自分たちで考えることが課題の本体**です。
  - kind: table
    headers:
      - 機能
      - やること
      - 難しさ
    rows:
      - - 盤面を表示する
        - 8×8のマス目をHTML/CSSで作る
        - 易
      - - 石を置く
        - クリックしたマスに石を表示する
        - 易
      - - 手番を管理する
        - 黒→白→黒…と交互に切り替える
        - 易
      - - 裏返す判定
        - 8方向を調べ、挟んだ石を裏返す
        - 難
      - - 置ける場所の判定
        - 裏返せる場所にしか置けないようにする
        - 難
      - - パス処理
        - 置ける場所が無いとき手番を飛ばす
        - 中
      - - 勝敗判定
        - 全マス埋まったら石を数えて勝敗を出す
        - 中
      - - 石数の表示
        - 現在の黒白の数を画面に出す
        - 易
  - kind: tip-box
    title: "💡 分解のコツ:"
    text: 「1つの機能 = 半日〜1日で終わる大きさ」を目安にします。大きすぎると進捗が見えず、小さすぎると管理が面倒になります。難しさも一緒に見積もっておくと、後の分担が楽になります。
  - kind: h3
    text: 分担と順番を決める
  - kind: paragraph
    text: 機能が並んだら、**どれから作るか**と**誰がやるか**を決めます。順番のコツは「まず動く最小限を作る」こと。裏返し判定のような難所から始めると、何も動かない期間が長くなって心が折れます。
  - kind: ol
    items:
      - "**第1週**: 盤面表示 + 石を置く（クリックしたら石が出る。ルールは無視）"
      - "**第2週**: 手番の切り替え + 石数表示（交互に置けるようになる）"
      - "**第3週**: 裏返し判定（ここが山。8方向のロジック）"
      - "**第4週**: 置ける場所の制限 + パス + 勝敗判定（ゲームとして完成）"
  - kind: warn-box
    title: "⚠️ 同じファイルを2人で触ると衝突する:"
    text: 2人が同時に同じ行を変更してpushすると、Gitが「どちらを採用すべきか分からない」と止まります（コンフリクト）。これは**事故ではなく正常な動作**です。慌てず、2人で画面を見ながらどちらを残すか決めれば直せます。分担するとき、なるべく担当ファイルを分けておくと衝突は減ります。
  - kind: h3
    text: 進捗を見える形にする
  - kind: paragraph
    text: GitHubには **Issues**（課題の一覧）という機能があります。分解した機能を1つずつIssueとして登録すると、「今どれをやっているか」「どこまで終わったか」が2人で共有できます。終わったらIssueを閉じる。これだけで進捗管理になります。
  - kind: assignment
    title: オセロを2人で作る
    goal: 共同リポジトリでオセロを完成させます。技術的な目的はGitの共同作業に慣れることですが、本当のゴールは**「大きなものを小さく割って、順番に片付ける」進め方を体で覚える**ことです。
    steps:
      - 2人で1つのGitHubリポジトリを作り、両方がpushできるようにする（Collaborator に追加）
      - 2人で話し合ってオセロの機能を洗い出し、Issueとして登録する
      - どれから作るか順番を決め、担当を分ける
      - 週ごとに区切って進める。毎回こまめにcommit・pushする
      - 相手のコードを読み、気付いたことを伝え合う
      - 完成したら2人で対戦してみる
    done:
      - 2人とも遊べるオセロが動いている
      - リポジトリの履歴に、2人分のcommitが交互に並んでいる
      - Issueが立てられ、終わったものが閉じられている
      - 「どの機能にどれくらいかかったか」を振り返って話せる
      - コンフリクトを最低1回は経験し、自力で解決した
    hint: 完璧を目指さないこと。まず「石が置けるだけ」の状態でいいので動かす。動くものがあると、次に何をすべきかが自然に見えてきます。逆に、全部作り終わるまで動かないやり方は必ず行き詰まります。
  - kind: tip-box
    title: "💡 詰まったときの合図:"
    text: 裏返し判定は多くの人が詰まります。8方向をどう表現するか、で悩んだら「方向を [x, y] の組で配列に持つ」と考えてみてください。それ以上は自分たちで調べてみましょう。
  - kind: checklist
    items:
      - clone / add / commit / push / pull の役割を言える
      - 自分のコードをGitHubにpushできる
      - こまめにcommitする習慣がついている
      - 大きな課題を機能単位に分解できる
      - 2人で1つのリポジトリを共有して開発できた
      - コンフリクトを解決したことがある
