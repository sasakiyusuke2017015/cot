id: 4
level: web
type: vcs
icon: "🌿"
title: Git
subtitle: 履歴を残し、2人でオセロを作る
source_refs:
  - input/raw/web-dev/mentoring-notes.md
teaching:
  sessions: 20
  goal: Gitの5コマンド習得は前半のみ。本体は「2人でオセロを完成させる」共同開発の体験。機能分解→分担→進捗管理を回させる。
  watch: 機能分解を代わりにやらないこと。粗くても自分たちで割らせる。裏返し判定で必ず詰まるので、答えではなく「8方向をどう表現するか」だけ示す。コンフリクトは事故ではないと繰り返し伝える。
  ask: いま何が動いていて、次に何を作る？その機能は1日で終わる大きさ？
keywords:
  - term: リポジトリ
    desc: コードと履歴をまとめて管理する保管庫
  - term: commit
    desc: 変更を履歴として記録する操作
  - term: ステージ
    desc: commit する変更を一時的に載せておく場所
  - term: push / pull
    desc: 手元の履歴をGitHubへ送る / 最新を取り込む
  - term: GitHub
    desc: リポジトリをネット上に置いて共有するサービス
  - term: .gitignore
    desc: 履歴に含めないファイルを指定する設定
  - term: コンフリクト
    desc: 2人が同じ箇所を変更したとき起きる衝突。手で解決する
  - term: Issue
    desc: GitHubの課題管理。やることを1件ずつ登録して進捗を共有する
  - term: 機能分解
    desc: 大きな課題を、1日で終わる大きさの機能に割ること
  - term: git status
    desc: いま何が変更されているかを確認するコマンド
content_blocks:
  - kind: kv-box
    title: "🎯 この章のゴール:"
    text: 5つの基本コマンドでコードをGitHubに置けるようになり、**2人で1つのリポジトリを共有してオセロを完成させる**。技術より「進め方」を身につけるのが本当の目的。
  - kind: h3
    text: なぜ今Gitを学ぶのか
  - kind: paragraph
    text: Gitはコードの**変更履歴を記録する**道具です。TypeScriptやReactより先に学ぶのは、実際の開発では**早い段階からGitを使う習慣**をつけたほうが自然だからです。ここから先の演習はすべてGitで履歴を残しながら進めます。
  - kind: paragraph
    text: そしてもうひとつ。ここから**2人での共同作業**が始まります。2人が同じファイルを別々に編集して、それを1つにまとめる——これはGitなしにはほぼ不可能です。
  - kind: h3
    text: Gitが無い世界を想像してみる
  - kind: paragraph
    text: Gitを使わずにファイルを管理すると、こうなります。見覚えがあるかもしれません。
  - kind: code
    text: |
      othello.html
      othello_修正.html
      othello_修正2.html
      othello_最終.html
      othello_最終_ほんとの最終.html
      othello_最終_田中さん修正版.html      ← どれが最新？
  - kind: paragraph
    text: この方式には致命的な問題が3つあります。**どれが最新か分からない**、**何をどう変えたか分からない**、**2人分の変更を1つにまとめられない**。Gitはこの3つをすべて解決します。
  - kind: table
    headers:
      - 知りたいこと
      - Gitがあると
    rows:
      - - いまの最新はどれか
        - 常に1つのファイルだけ。最新はいつもそれ
      - - 昨日から何が変わったか
        - 変更点だけを色付きで表示できる
      - - なぜこう直したか
        - commitメッセージに理由が残っている
      - - 壊す前に戻したい
        - 過去のどの時点にも戻せる
      - - 2人の変更をまとめたい
        - 自動で合成してくれる。無理な箇所だけ人間が判断する
  - kind: h3
    text: 準備 — Gitを入れて名前を設定する
  - kind: paragraph
    text: 第1章と同じく、ここも一度やれば以降ずっと使う設定です。まず `Git for Windows`（Macなら公式サイトの案内）で検索してインストールしてください。選択肢はすべて既定のままで構いません。
  - kind: paragraph
    text: 入ったら、VS Codeのターミナル（表示 → ターミナル）で次を実行します。**これは履歴に残る「誰がやったか」の名前**なので、最初に必ず設定します。
  - kind: code
    text: |
      git --version                                  # 入ったか確認
      git config --global user.name "Tanaka Taro"    # 履歴に残る名前
      git config --global user.email "you@example.com"  # GitHubと同じアドレス
      git config --global init.defaultBranch main    # 既定のブランチ名を main に
  - kind: warn-box
    title: "⚠️ メールアドレスはGitHubと揃える:"
    text: ここで設定したアドレスがGitHubのアカウントと違うと、**GitHub上で「誰のcommitか」が紐付きません**。見た目の問題だけですが、2人分の作業量を確認するときに困るので最初に揃えておいてください。
  - kind: paragraph
    text: 次にGitHubのアカウントを作ります。無料です。作ったら、右上のアイコンから「Your repositories」→「New」で空のリポジトリを1つ作ってみてください。
  - kind: tip-box
    title: "💡 初回のpushで認証を求められる:"
    text: 最初にpushするとき、ユーザー名とパスワードを聞かれます。ここで**GitHubのログインパスワードは使えません**（数年前に廃止されました）。GitHubの Settings → Developer settings → Personal access tokens でトークンを発行し、それをパスワードの代わりに貼り付けます。ここは詰まりやすいので、講師と一緒にやると早いです。
  - kind: h3
    text: まず覚える5コマンド
  - kind: code
    text: |
      git clone <URL>     # リモートのリポジトリを手元に複製する
      git add .           # 変更をステージに載せる（コミット対象にする）
      git commit -m "メッセージ"   # 変更を履歴として記録する
      git push            # 手元の履歴をGitHubに送る
      git pull            # GitHubの最新を手元に取り込む
  - kind: paragraph
    text: 日々の流れは「書く → add → commit → push」の繰り返しです。**この5つだけで十分**。branchやrebaseは後回しで構いません（チーム開発に入る段階で学びます）。
  - kind: h3
    text: add と commit はなぜ2段階なのか
  - kind: paragraph
    text: 「保存するだけなのに、なぜ2回もコマンドを打つのか」——最初に必ず出る疑問です。Gitにはファイルの居場所が3つあり、addとcommitはその間を移動させる操作だからです。
  - kind: code
    text: |
      [作業ディレクトリ]      [ステージ]           [リポジトリ]
      いま編集中のファイル  →  次のcommitに      →  履歴として確定
                    git add    載せるものを選ぶ    git commit

      例: 3ファイル直したが、そのうち2つだけ記録したい
        git add index.html style.css   ← この2つだけステージに載せる
        git commit -m "盤面の見た目を整える"
  - kind: paragraph
    text: つまりステージは「**今回の記録に含めるものを選ぶ場所**」です。慣れるまでは `git add .`（全部載せる）で構いません。ただ「この変更はまだ途中だから含めたくない」というときに、この2段階が効いてきます。
  - kind: h3
    text: 実は最初に覚えるべきは status と log
  - kind: paragraph
    text: 5コマンドより先に使うのがこの2つです。**いま何が起きているかを確認するコマンド**で、迷ったら必ずこれを打ちます。
  - kind: code
    text: |
      git status     # いま何が変更されている？何がステージに載っている？
      git log        # これまでの履歴（q キーで抜ける）
      git log --oneline   # 1行ずつ簡潔に
      git diff       # 前回のcommitから何が変わったか
  - kind: tip-box
    title: "💡 困ったら git status:"
    text: Gitで詰まったときの9割は `git status` が答えを持っています。**しかも親切に「次に打つべきコマンド」まで書いてくれます**。エラーが出たら、まず status。これを習慣にしてください。
  - kind: h3
    text: 何を履歴に含めないか — .gitignore
  - kind: paragraph
    text: リポジトリには**入れてはいけないもの**があります。パスワードなどの秘密情報、自動生成されるファイル、巨大なファイルです。これらは `.gitignore` というファイルに書いて除外します。
  - kind: code
    text: |
      # .gitignore  ← この名前でリポジトリの一番上に置く

      node_modules/     # 自動で作られる。巨大なので入れない
      venv/             # Pythonの仮想環境（第5章）
      .env              # APIキーやパスワード。絶対に入れない
      *.db              # データベースファイル（第8章）
      .DS_Store         # Macが勝手に作るファイル
  - kind: warn-box
    title: "⚠️ 一度pushした秘密情報は消せないと思うこと:"
    text: パスワードやAPIキーをcommitしてpushすると、**あとからファイルを消しても履歴には残り続けます**。公開リポジトリなら世界中から見える状態です。この場合の正しい対応は「ファイルを消す」ではなく「**そのキーを無効化して作り直す**」です。だから最初から .gitignore に入れておくことが重要になります。
  - kind: h3
    text: commitメッセージの書き方
  - kind: paragraph
    text: メッセージは未来の自分と相方へのメモです。**「何をしたか」を短く**書きます。凝る必要はありませんが、次のような書き方は避けてください。
  - kind: table
    headers:
      - 良くない例
      - 良い例
      - なぜ
    rows:
      - - 修正
        - 石が置けないバグを修正
        - 何を修正したか分からない
      - - あああ
        - 盤面の8×8表示を追加
        - 検索しても見つけられない
      - - いろいろ変えた
        - 手番の切り替えを実装
        - 1コミットに詰め込みすぎている合図
      - - "`WIP`"
        - 裏返し判定の途中（縦横のみ対応）
        - 途中なら何がどこまでか書く
  - kind: tip-box
    title: "💡 commitの粒度:"
    text: 「1日の終わりにまとめて1回」ではなく、**キリのいい単位でこまめに**commitします。目安は「メッセージが1文で書ける範囲」。2つ以上のことを書きたくなったら、それは2回に分けるべきcommitです。
  - kind: ex-box
    title: 練習
    text: まず1人で慣れます。GitHubにリポジトリを作り、前章までのプロフィールカード（HTML・CSS・JSの3ファイル）をpushしてみましょう。3回以上commitを分けて、GitHub上で履歴が見えることを確認します。そのあと `git log --oneline` で、自分が書いたメッセージが読めるものになっているか眺めてみてください。
  - kind: h3
    text: ここからが本番 — 2人で1つのものを作る
  - kind: paragraph
    text: ここまでは1人で作ってきました。ここからは**2人で1つのリポジトリを共有して**オセロを作ります。これがこのコース最大の山場であり、いちばん面白いところです。
  - kind: kv-box
    title: "📌 なぜオセロなのか:"
    text: オセロは**HTML・CSS・JavaScriptだけで完成させられます**。新しい技術を覚える必要がなく、ここまでの知識だけで「ちゃんと遊べるもの」が作れる。だから技術ではなく**進め方**に集中できます。
  - kind: h3
    text: いきなり書き始めない — まず機能に分解する
  - kind: paragraph
    text: 「オセロを作ろう」と言われても、どこから手をつけるか分かりません。実務でも同じで、**まず何が必要かを洗い出して、小さな単位に割る**ところから始めます。これを機能分解と呼びます。
  - kind: paragraph
    text: 2人で話し合って、オセロに必要な機能を挙げてください。以下は例です。**この表を鵜呑みにせず、自分たちで考えることが課題の本体**です。
  - kind: table
    headers:
      - 機能
      - やること
      - 難しさ
    rows:
      - - 盤面を表示する
        - 8×8のマス目をHTML/CSSで作る
        - 易
      - - 石を置く
        - クリックしたマスに石を表示する
        - 易
      - - 手番を管理する
        - 黒→白→黒…と交互に切り替える
        - 易
      - - 裏返す判定
        - 8方向を調べ、挟んだ石を裏返す
        - 難
      - - 置ける場所の判定
        - 裏返せる場所にしか置けないようにする
        - 難
      - - パス処理
        - 置ける場所が無いとき手番を飛ばす
        - 中
      - - 勝敗判定
        - 全マス埋まったら石を数えて勝敗を出す
        - 中
      - - 石数の表示
        - 現在の黒白の数を画面に出す
        - 易
  - kind: tip-box
    title: "💡 分解のコツ:"
    text: 「1つの機能 = 半日〜1日で終わる大きさ」を目安にします。大きすぎると進捗が見えず、小さすぎると管理が面倒になります。難しさも一緒に見積もっておくと、後の分担が楽になります。
  - kind: h3
    text: 分担と順番を決める
  - kind: paragraph
    text: 機能が並んだら、**どれから作るか**と**誰がやるか**を決めます。順番のコツは「まず動く最小限を作る」こと。裏返し判定のような難所から始めると、何も動かない期間が長くなって心が折れます。
  - kind: ol
    items:
      - "**第1週**: 盤面表示 + 石を置く（クリックしたら石が出る。ルールは無視）"
      - "**第2週**: 手番の切り替え + 石数表示（交互に置けるようになる）"
      - "**第3週**: 裏返し判定（ここが山。8方向のロジック）"
      - "**第4週**: 置ける場所の制限 + パス + 勝敗判定（ゲームとして完成）"
  - kind: kv-box
    title: "📌 「動くもの」を絶やさない:"
    text: この順番には理由があります。毎週の終わりに**必ず何かが動いている状態**を保つためです。動くものがあると、次に何をすべきかが自然に見えます。逆に「全部作り終わるまで何も動かない」進め方は、詰まったときにどこが悪いのか切り分けられず、必ず行き詰まります。
  - kind: h3
    text: 2人で回すときの約束ごと
  - kind: paragraph
    text: 共同作業では、**作業を始める前に必ず `git pull`** します。相方が先に何かをpushしているかもしれないからです。これを飛ばすと衝突が増えます。
  - kind: code
    text: |
      # 作業を始めるとき
      git pull                       # まず最新を取り込む
      # …コードを書く…
      git add .
      git commit -m "石数の表示を追加"
      git pull                       # pushの前にもう一度（相方が進んでいるかも）
      git push
  - kind: ul
    items:
      - "**始める前に pull、終わったら push** — これを毎回やる"
      - "**作業を手元に溜め込まない** — 3日分まとめてpushすると衝突が大きくなる"
      - "**担当ファイルをなるべく分ける** — 同じ行を触らなければ衝突しない"
      - "**動かない状態でpushしない** — 相方がpullした瞬間に壊れる"
  - kind: h3
    text: コンフリクト — 起きて当たり前のもの
  - kind: paragraph
    text: 2人が同時に同じ行を変更してpushすると、Gitが「どちらを採用すべきか分からない」と止まります。これがコンフリクトです。**事故ではなく正常な動作**で、共同開発をしていれば必ず起きます。
  - kind: paragraph
    text: 起きると、ファイルの中がこうなります。慌てず、落ち着いて読んでください。
  - kind: code
    text: |
      <<<<<<< HEAD
      const CELL_SIZE = 60;        ← 自分が書いた内容
      =======
      const CELL_SIZE = 50;        ← 相方が書いた内容
      >>>>>>> main

      直し方: 2人でどちらを残すか決めて、
             記号3行（<<<<<<<, =======, >>>>>>>）ごと消して
             残したい形に書き直す。両方を活かす形でもよい。
  - kind: code
    text: |
      # 直したあと
      git add .
      git commit -m "コンフリクトを解決"
      git push
  - kind: warn-box
    title: "⚠️ 記号を消し忘れるとコードが壊れます:"
    text: "`<<<<<<<` や `=======` はGitが入れた目印であって、コードではありません。**消し忘れたままcommitすると確実に動かなくなります**。解決したら必ずブラウザで動作を確認してからpushしてください。"
  - kind: h3
    text: よくあるエラーと対処
  - kind: table
    headers:
      - エラー
      - 意味
      - 対処
    rows:
      - - not a git repository
        - そのフォルダはGit管理下にない
        - 場所が違う。`cd` で移動するか `git init`
      - - "`rejected` / non-fast-forward"
        - 相方が先にpushしている
        - "`git pull` してから push し直す"
      - - Please tell me who you are
        - 名前とメールが未設定
        - "`git config --global user.name` を設定"
      - - CONFLICT (content)
        - コンフリクト発生
        - 上の手順で解決してcommit
      - - nothing to commit
        - 変更がない、またはaddし忘れ
        - "`git status` で確認、`git add` を実行"
      - - Support for password authentication was removed
        - パスワード認証が使えない
        - アクセストークンを発行して使う
  - kind: h3
    text: 進捗を見える形にする
  - kind: paragraph
    text: GitHubには **Issues**（課題の一覧）という機能があります。分解した機能を1つずつIssueとして登録すると、「今どれをやっているか」「どこまで終わったか」が2人で共有できます。終わったらIssueを閉じる。これだけで進捗管理になります。
  - kind: paragraph
    text: リモートで離れて作業していると、相手が何をしているか見えません。Issueは**その見えなさを埋めるための道具**です。凝った使い方は要りません。「立てる・担当を書く・終わったら閉じる」の3つだけで十分機能します。
  - kind: assignment
    title: オセロを2人で作る
    goal: 共同リポジトリでオセロを完成させます。技術的な目的はGitの共同作業に慣れることですが、本当のゴールは**「大きなものを小さく割って、順番に片付ける」進め方を体で覚える**ことです。
    steps:
      - 2人で1つのGitHubリポジトリを作り、両方がpushできるようにする（Collaborator に追加）
      - "`.gitignore` を最初に置いておく"
      - 2人で話し合ってオセロの機能を洗い出し、Issueとして登録する
      - どれから作るか順番を決め、担当を分ける
      - 週ごとに区切って進める。毎回こまめにcommit・pushする
      - 作業を始める前に必ず pull する習慣をつける
      - 相手のコードを読み、気付いたことを伝え合う
      - 完成したら2人で対戦してみる
    done:
      - 2人とも遊べるオセロが動いている
      - リポジトリの履歴に、2人分のcommitが交互に並んでいる
      - Issueが立てられ、終わったものが閉じられている
      - "「どの機能にどれくらいかかったか」を振り返って話せる"
      - コンフリクトを最低1回は経験し、自力で解決した
      - commitメッセージを読むだけで、何をやってきたか追える
    hint: 完璧を目指さないこと。まず「石が置けるだけ」の状態でいいので動かす。動くものがあると、次に何をすべきかが自然に見えてきます。逆に、全部作り終わるまで動かないやり方は必ず行き詰まります。
  - kind: tip-box
    title: "💡 詰まったときの合図:"
    text: 裏返し判定は多くの人が詰まります。8方向をどう表現するか、で悩んだら「方向を [x, y] の組で配列に持つ」と考えてみてください。それ以上は自分たちで調べてみましょう。
  - kind: ex-box
    title: 発展課題（余裕があれば）
    text: "`git branch` を試してみましょう。「作業用の枝を作って、そこで開発し、できたら本流に合流させる」やり方です。実務ではこちらが基本になります。2人とも余裕が出てきたら、Pull Request（変更をレビューしてもらってから合流させる仕組み）まで触ってみてください。第4章の時点では必須ではありません。"
  - kind: tip-box
    title: "💡 次章への橋渡し:"
    text: オセロが完成しました。ただ、いまの対戦結果は**ページを閉じれば消えます**。次章からは「戦績を残す」ためにサーバ側の世界へ入っていきます。まずはその言語であるPythonからです。
  - kind: checklist
    items:
      - Gitが解決している問題を説明できる
      - clone / add / commit / push / pull の役割を言える
      - add と commit が2段階になっている理由が分かる
      - 困ったとき git status を見る習慣がついている
      - 自分のコードをGitHubにpushできる
      - .gitignore で秘密情報を除外できる
      - こまめにcommitする習慣がついている
      - 大きな課題を機能単位に分解できる
      - 2人で1つのリポジトリを共有して開発できた
      - コンフリクトを解決したことがある
