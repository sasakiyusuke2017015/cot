source_refs:
  - input/raw/lv0/ai-basics.md

keywords:
  - { term: AIブーム, desc: AIへの注目・研究が高まった時期。これまで3回起きている }
  - { term: 機械学習, desc: データからパターンを自動的に学習するAI技術。現代のAIの基盤 }
  - { term: ハルシネーション, desc: AIが事実でない内容を正しいかのように生成する現象。「幻覚」とも }

content_blocks:
  - kind: tip-box
    title: この章の学習ポイント
    text: AIの進化の流れを理解し、得意・不得意を知って業務活用の判断ができるようになる。ハルシネーション（AIの誤り）を知り、正しく付き合う姿勢を身につける。

  - kind: h3
    text: 1-1. AIの歴史

  - kind: paragraph
    text: AIは突然登場した技術ではありません。何十年もの研究と停滞を繰り返しながら、少しずつ進化してきました。

  - kind: table
    headers: [時期, ブームの内容]
    rows:
      - ["第1次（1950〜60年代）", "コンピュータがパズルや簡単なゲームを解けるようになった"]
      - ["第2次（1980〜90年代）", "専門家の知識をルール化する「エキスパートシステム」が登場した"]
      - ["第3次（2010年代〜現在）", "データから自分で学ぶ「機械学習」が急発展し、AIが身近になった"]

  - kind: paragraph
    text: "**機械学習**とは、コンピュータが大量のデータを分析し、パターンやルールを自分で見つけ出す技術です。さらに進化した**生成AI**は、文章・画像・コードなど新しいコンテンツをゼロから生み出せます。"

  - kind: h3
    text: 1-2. AIの得意・不得意

  - kind: paragraph
    text: "**AIが得意なこと：**文章の要約・整理、生成・言い換え、アイデア出し、翻訳・多言語対応。**限界・不得意：**最新情報を持たない、社内固有情報を知らない、責任ある意思決定が難しい、数値の正確性に注意。"

  - kind: warn-box
    title: ハルシネーション（誤り）に注意
    text: ハルシネーション（幻覚）とは、AIが事実でない情報をあたかも正しいかのように生成する現象です。文章が流暢でも内容が正確とは限りません。重要な情報は必ず一次情報で確認しましょう。

  - kind: checklist
    title: 業務判断チェックリスト
    items:
      - "AIに任せやすい：繰り返し発生する定型的な作業"
      - "AIに任せやすい：下書き・草案レベルで、最後に人が確認できる作業"
      - "人が主導すべき：社内固有の判断や責任を伴う意思決定"
      - "人が主導すべき：最新情報や正確な数値が必須の業務"
